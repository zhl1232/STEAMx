<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" rx="28" fill="#f8fafc"/><rect x="28" y="28" width="1544" height="944" rx="22" fill="white" stroke="#dbe4ee" stroke-width="3"/><text x="74" y="102" font-family="'Noto Sans CJK SC', 'Unifont', sans-serif" font-size="48" font-weight="700" fill="#102a43">光控小夜灯 · 接线对照</text><text x="76" y="148" font-family="'Noto Sans CJK SC', 'Unifont', sans-serif" font-size="25" fill="#526779">按行核对每一条连接；箭头表示连接方向</text><rect x="115" y="191" width="1370" height="88" rx="18" fill="#f0fdf4" stroke="#cbdbe8" stroke-width="2"/><text x="155" y="245" font-family="'Noto Sans CJK SC', 'Unifont', sans-serif" font-size="36" font-weight="700" fill="#102a43">① +4.5V → 10kΩ → 节点 A → 光敏电阻 → GND</text><rect x="115" y="316" width="1370" height="88" rx="18" fill="#f0f7ff" stroke="#cbdbe8" stroke-width="2"/><text x="155" y="370" font-family="'Noto Sans CJK SC', 'Unifont', sans-serif" font-size="36" font-weight="700" fill="#102a43">② 节点 A → 4.7kΩ → S8050 基极 B</text><rect x="115" y="441" width="1370" height="88" rx="18" fill="#f0fdf4" stroke="#cbdbe8" stroke-width="2"/><text x="155" y="495" font-family="'Noto Sans CJK SC', 'Unifont', sans-serif" font-size="36" font-weight="700" fill="#102a43">③ S8050 发射极 E → GND</text><rect x="115" y="566" width="1370" height="88" rx="18" fill="#f0f7ff" stroke="#cbdbe8" stroke-width="2"/><text x="155" y="620" font-family="'Noto Sans CJK SC', 'Unifont', sans-serif" font-size="36" font-weight="700" fill="#102a43">④ +4.5V → 330Ω → LED 阳极（+）</text><rect x="115" y="691" width="1370" height="88" rx="18" fill="#f0fdf4" stroke="#cbdbe8" stroke-width="2"/><text x="155" y="745" font-family="'Noto Sans CJK SC', 'Unifont', sans-serif" font-size="36" font-weight="700" fill="#102a43">⑤ LED 阴极（−）→ S8050 集电极 C</text><rect x="115" y="860" width="1370" height="70" rx="16" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/><text x="155" y="906" font-family="'Noto Sans CJK SC', 'Unifont', sans-serif" font-size="26" fill="#7c2d12">S8050：B＝基极｜E＝发射极｜C＝集电极；以所用数据表/封装标注为准。</text></svg>