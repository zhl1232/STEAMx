<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect width="1400" height="900" rx="28" fill="#f8fafc"/><rect x="28" y="28" width="1344" height="844" rx="22" fill="white" stroke="#dbe4ee" stroke-width="3"/><text x="74" y="102" font-family="'Noto Sans CJK SC', 'Unifont', sans-serif" font-size="48" font-weight="700" fill="#102a43">几何印章肥皂｜凸起印面与纸上印迹</text><text x="76" y="148" font-family="'Noto Sans CJK SC', 'Unifont', sans-serif" font-size="25" fill="#526779">左：雕刻后保留的凸起几何图案；右：蘸印泥后的对应印迹</text><g stroke="#7c3aed" stroke-width="9" stroke-linejoin="round"><rect x="130" y="280" width="420" height="420" rx="24" fill="#f1e8ff"/><path d="M220 590V390h240v200z" fill="none"/><path d="M220 390l120-90 120 90" fill="none"/><circle cx="340" cy="510" r="62" fill="#f7c948"/><path d="M240 620h200" stroke="#db2777"/></g><path d="M620 490h130" stroke="#64748b" stroke-width="8"/><path d="m720 460 40 30-40 30" fill="none" stroke="#64748b" stroke-width="8"/><rect x="850" y="280" width="420" height="420" rx="24" fill="white" stroke="#cbd5e1" stroke-width="5"/><g stroke="#c2410c" stroke-width="11" fill="none" stroke-linejoin="round"><path d="M940 590V390h240v200z"/><path d="M940 390l120-90 120 90"/><circle cx="1060" cy="510" r="62" fill="#f7c948"/><path d="M960 620h200"/></g><text x="235" y="755" font-family="'Noto Sans CJK SC', 'Unifont', sans-serif" font-size="30" font-weight="700" fill="#6d28d9">肥皂块：凸起图案</text><text x="925" y="755" font-family="'Noto Sans CJK SC', 'Unifont', sans-serif" font-size="30" font-weight="700" fill="#c2410c">纸张：对应印迹</text><text x="165" y="840" font-family="'Noto Sans CJK SC', 'Unifont', sans-serif" font-size="27" fill="#334e68">削去留白，保持印面平整；只做方形、三角形、圆形等几何元素。</text></svg>