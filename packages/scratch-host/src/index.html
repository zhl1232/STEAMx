<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scratch 编辑器</title>
    <script>
      if (new URLSearchParams(location.search).get("embed") === "1") {
        document.documentElement.dataset.embed = "1";
      }
    </script>
    <script src="vendor/react.production.min.js"></script>
    <script src="vendor/react-dom.production.min.js"></script>
    <script src="vendor/redux.min.js"></script>
    <script src="vendor/react-redux.min.js"></script>
    <style>
      html, body, #scratch-host-root {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      html[data-embed="1"] #scratch-save-bar {
        display: none;
      }
      /* Fallback if redux loader state lags behind host bootstrap */
      html[data-scratch-ready="1"] [class*="loader_background"] {
        display: none !important;
        pointer-events: none !important;
      }
      #scratch-save-bar {
        position: fixed;
        top: 0;
        right: 0;
        z-index: 1000;
        display: flex;
        gap: 8px;
        padding: 8px 12px;
        background: rgba(255, 255, 255, 0.92);
        border-bottom-left-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        font-family: system-ui, sans-serif;
        font-size: 14px;
      }
      #scratch-save-bar button {
        padding: 6px 14px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        font-weight: 600;
      }
      #scratch-save-btn {
        background: #4c97ff;
        color: #fff;
      }
      #scratch-status {
        align-self: center;
        color: #555;
        font-size: 12px;
      }
      #scratch-block-hint-overlay {
        position: fixed;
        top: 54px;
        right: 14px;
        z-index: 1200;
        max-width: min(360px, calc(100vw - 28px));
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        padding: 10px 12px;
        border: 1px solid rgba(245, 158, 11, 0.42);
        border-radius: 8px;
        background: rgba(255, 251, 235, 0.96);
        box-shadow: 0 10px 28px rgba(15, 23, 42, 0.18);
        color: #3f2f05;
        font-family: system-ui, sans-serif;
        pointer-events: auto;
      }
      .scratch-block-hint-title {
        grid-column: 1 / 2;
        font-size: 13px;
        font-weight: 700;
        line-height: 1.2;
      }
      .scratch-block-hint-category {
        grid-column: 1 / 3;
        margin-top: -2px;
        color: #6f4a0b;
        font-size: 12px;
        line-height: 1.35;
      }
      .scratch-block-hint-category[hidden] {
        display: none;
      }
      .scratch-block-hint-keywords {
        grid-column: 1 / 3;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .scratch-block-hint-chip {
        border: 1px solid rgba(217, 119, 6, 0.38);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.86);
        padding: 3px 8px;
        font-size: 12px;
        font-weight: 650;
        line-height: 1.35;
        color: #8a4b0c;
      }
      .scratch-block-hint-close {
        grid-column: 2 / 3;
        grid-row: 1 / 2;
        width: 24px;
        height: 24px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: #7c4a03;
        cursor: pointer;
        font-size: 18px;
        line-height: 1;
      }
      .scratch-block-hint-close:hover {
        background: rgba(245, 158, 11, 0.14);
      }
      .scratch-block-hint-target {
        filter: drop-shadow(0 0 0.35rem rgba(245, 158, 11, 0.95))
          drop-shadow(0 0 0.8rem rgba(245, 158, 11, 0.42));
      }
      /* 完全隐藏 Scratch 顶部菜单栏容器 */
      [class*="gui_menu-bar-position"],
      [class*="menu-bar_menu-bar"] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="scratch-save-bar">
      <span id="scratch-status">加载中…</span>
      <button type="button" id="scratch-save-btn">保存到课程</button>
    </div>
    <div id="scratch-host-root"></div>
    <!-- scratch-gui UMD expects lowercase globals (react, react-dom, …) -->
    <script>
      window.react = window.React;
      window["react-dom"] = window.ReactDOM;
      window.redux = window.Redux;
      window["react-redux"] = window.ReactRedux;
    </script>
    <script src="scratch-gui.js"></script>
  </body>
</html>
