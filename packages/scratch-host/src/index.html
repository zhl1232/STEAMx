<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scratch 编辑器</title>
    <script>
      if (new URLSearchParams(location.search).get("embed") === "1") {
        document.documentElement.dataset.embed = "1";
      }
    </script>
    <script src="vendor/react.production.min.js"></script>
    <script src="vendor/react-dom.production.min.js"></script>
    <script src="vendor/redux.min.js"></script>
    <script src="vendor/react-redux.min.js"></script>
    <style>
      html, body, #scratch-host-root {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      html[data-embed="1"] #scratch-save-bar {
        display: none;
      }
      /* Fallback if redux loader state lags behind host bootstrap */
      html[data-scratch-ready="1"] [class*="loader_background"] {
        display: none !important;
        pointer-events: none !important;
      }
      #scratch-save-bar {
        position: fixed;
        top: 0;
        right: 0;
        z-index: 1000;
        display: flex;
        gap: 8px;
        padding: 8px 12px;
        background: rgba(255, 255, 255, 0.92);
        border-bottom-left-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        font-family: system-ui, sans-serif;
        font-size: 14px;
      }
      #scratch-save-bar button {
        padding: 6px 14px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        font-weight: 600;
      }
      #scratch-save-btn {
        background: #4c97ff;
        color: #fff;
      }
      #scratch-status {
        align-self: center;
        color: #555;
        font-size: 12px;
      }
      /* 完全隐藏 Scratch 顶部菜单栏容器 */
      [class*="gui_menu-bar-position"],
      [class*="menu-bar_menu-bar"] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="scratch-save-bar">
      <span id="scratch-status">加载中…</span>
      <button type="button" id="scratch-save-btn">保存到课程</button>
    </div>
    <div id="scratch-host-root"></div>
    <!-- scratch-gui UMD expects lowercase globals (react, react-dom, …) -->
    <script>
      window.react = window.React;
      window["react-dom"] = window.ReactDOM;
      window.redux = window.Redux;
      window["react-redux"] = window.ReactRedux;
    </script>
    <script src="scratch-gui.js"></script>
  </body>
</html>
