server {
    listen 80;
    server_name __NGINX_SERVER_NAMES__;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name __NGINX_SERVER_NAMES__;

    ssl_certificate     __NGINX_SSL_CERTIFICATE__;
    ssl_certificate_key __NGINX_SSL_CERTIFICATE_KEY__;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    # gzip 压缩
    gzip on;
    # Next.js 响应经 proxy_pass 转发；Nginx 默认不会压缩代理响应，
    # 会让 18 MB 的 Scratch GUI 以原始体积传输。
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 1000;

    location /api/upload {
        client_max_body_size 15m;
        proxy_pass http://127.0.0.1:3000;
    }

    location /api/upload-video {
        client_max_body_size 40m;
        proxy_pass http://127.0.0.1:3000;
    }

    # 静态资源长缓存（Next.js 带 hash 的文件）
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Scratch GUI 是独立构建的静态运行时。主包未带内容 hash，使用一天缓存
    # 并在后台重验证，避免长期缓存阻塞编辑器升级。
    location ~ ^/scratch/(scratch-gui\.js|vendor/|chunks/) {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
    }

    # 所有请求代理到 Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
