services:
  steam-app:
    image: "${STEAM_APP_IMAGE:-steam-app:latest}"
    container_name: steam-app
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.production
    environment:
      NODE_OPTIONS: "${STEAM_APP_NODE_OPTIONS:---max-old-space-size=512}"
    mem_limit: "${STEAM_APP_MEMORY_LIMIT:-1g}"
    memswap_limit: "${STEAM_APP_MEMORY_LIMIT:-1g}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  auto-interactions-worker:
    image: "${STEAM_APP_IMAGE:-steam-app:latest}"
    container_name: steam-auto-interactions-worker
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    depends_on:
      steam-app:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      AUTO_INTERACTION_WORKER_URL: http://steam-app:3000/api/internal/auto-interactions/run
      NODE_OPTIONS: "${AUTO_INTERACTION_NODE_OPTIONS:---max-old-space-size=96}"
    mem_limit: "${AUTO_INTERACTION_MEMORY_LIMIT:-128m}"
    memswap_limit: "${AUTO_INTERACTION_MEMORY_LIMIT:-128m}"
    command: ["node", "auto-interactions-worker.mjs"]

  communications-worker:
    image: "${STEAM_APP_IMAGE:-steam-app:latest}"
    container_name: steam-communications-worker
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    depends_on:
      steam-app:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      COMMUNICATIONS_WORKER_URL: http://steam-app:3000/api/internal/communications/run
      NODE_OPTIONS: "${COMMUNICATIONS_WORKER_NODE_OPTIONS:---max-old-space-size=96}"
    mem_limit: "${COMMUNICATIONS_WORKER_MEMORY_LIMIT:-128m}"
    memswap_limit: "${COMMUNICATIONS_WORKER_MEMORY_LIMIT:-128m}"
    command: ["node", "communications-worker.mjs"]
