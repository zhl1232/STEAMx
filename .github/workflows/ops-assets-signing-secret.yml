name: Ops Assets Signing Secret

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-assets-signing-secret
  cancel-in-progress: false

jobs:
  upsert-and-recreate:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Upsert signing env and recreate steam-app
        uses: appleboy/ssh-action@v1.2.0
        env:
          ASSETS_URL_SIGNING_SECRET: ${{ secrets.ASSETS_URL_SIGNING_SECRET }}
          ASSETS_URL_SIGNING_TTL_SECONDS: "1200"
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: ASSETS_URL_SIGNING_SECRET,ASSETS_URL_SIGNING_TTL_SECONDS
          script_stop: true
          debug: true
          script: |
            set -euo pipefail
            echo "step:start uid=$(id -u)"
            test -n "${ASSETS_URL_SIGNING_SECRET:-}"
            ASSETS_URL_SIGNING_SECRET="$(printf '%s' "$ASSETS_URL_SIGNING_SECRET" | tr -d '\r\n')"
            export ASSETS_URL_SIGNING_SECRET
            echo "step:secret_len=${#ASSETS_URL_SIGNING_SECRET}"
            cd /opt/steam-app
            echo "step:cwd=$(pwd)"
            test -f .env.production
            echo "step:env_file_ok"
            ls -la .env.production
            tmp="$(mktemp)"
            cp .env.production "$tmp"
            echo "step:tmp_copied"
            if grep -qE '^ASSETS_URL_SIGNING_SECRET=' "$tmp"; then
              sed -i "s|^ASSETS_URL_SIGNING_SECRET=.*|ASSETS_URL_SIGNING_SECRET=${ASSETS_URL_SIGNING_SECRET}|" "$tmp"
              echo "step:secret_updated"
            else
              printf '\nASSETS_URL_SIGNING_SECRET=%s\n' "${ASSETS_URL_SIGNING_SECRET}" >> "$tmp"
              echo "step:secret_appended"
            fi
            if grep -qE '^ASSETS_URL_SIGNING_TTL_SECONDS=' "$tmp"; then
              sed -i "s|^ASSETS_URL_SIGNING_TTL_SECONDS=.*|ASSETS_URL_SIGNING_TTL_SECONDS=${ASSETS_URL_SIGNING_TTL_SECONDS}|" "$tmp"
              echo "step:ttl_updated"
            else
              printf 'ASSETS_URL_SIGNING_TTL_SECONDS=%s\n' "${ASSETS_URL_SIGNING_TTL_SECONDS}" >> "$tmp"
              echo "step:ttl_appended"
            fi
            grep -qE '^ASSETS_URL_SIGNING_SECRET=.+' "$tmp"
            grep -qE '^ASSETS_URL_SIGNING_TTL_SECONDS=.+' "$tmp"
            # length only via awk (no secret print)
            awk -F= '/^ASSETS_URL_SIGNING_SECRET=/{print "step:file_secret_len", length($2); found=1} END{exit found?0:1}' "$tmp"
            cp "$tmp" .env.production
            rm -f "$tmp"
            echo "step:env_written"
            echo "step:recreate"
            docker compose up -d --force-recreate --no-deps steam-app
            for i in $(seq 1 60); do
              if docker compose exec -T steam-app node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                echo "step:healthy"
                docker compose exec -T steam-app node -e "const s=(process.env.ASSETS_URL_SIGNING_SECRET||'').trim(); console.log('step:container_secret_len', s.length); process.exit(s.length>=32?0:2)"
                echo "step:done"
                exit 0
              fi
              sleep 2
            done
            echo "steam-app health timeout" >&2
            exit 1
