name: Ops Assets Signing Secret

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-assets-signing-secret
  cancel-in-progress: false

jobs:
  upsert-and-recreate:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Upsert signing env and recreate steam-app
        uses: appleboy/ssh-action@v1.2.0
        env:
          ASSETS_URL_SIGNING_SECRET: ${{ secrets.ASSETS_URL_SIGNING_SECRET }}
          ASSETS_URL_SIGNING_TTL_SECONDS: "1200"
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: ASSETS_URL_SIGNING_SECRET,ASSETS_URL_SIGNING_TTL_SECONDS
          script_stop: true
          debug: true
          script: |
            set -euo pipefail
            echo "step:start uid=$(id -u) user=$(id -un)"
            test -n "${ASSETS_URL_SIGNING_SECRET:-}" || { echo "missing ASSETS_URL_SIGNING_SECRET" >&2; exit 1; }
            ASSETS_URL_SIGNING_SECRET="$(printf '%s' "$ASSETS_URL_SIGNING_SECRET" | tr -d '\r\n')"
            export ASSETS_URL_SIGNING_SECRET
            echo "step:secret_len=${#ASSETS_URL_SIGNING_SECRET}"
            run_root() { if [ "$(id -u)" -eq 0 ]; then "$@"; else sudo -n "$@"; fi; }
            cd /opt/steam-app
            echo "step:cwd=$(pwd)"
            run_root test -f .env.production
            echo "step:env_file_ok"
            run_root ls -la .env.production
            tmp="$(mktemp)"
            run_root cat .env.production > "$tmp"
            python3 - "$tmp" <<'PY'
            import os, re, sys, pathlib
            path = pathlib.Path(sys.argv[1])
            text = path.read_text(encoding="utf-8")
            updates = {
                "ASSETS_URL_SIGNING_SECRET": os.environ["ASSETS_URL_SIGNING_SECRET"],
                "ASSETS_URL_SIGNING_TTL_SECONDS": os.environ.get("ASSETS_URL_SIGNING_TTL_SECONDS", "1200"),
            }
            for key, value in updates.items():
                pattern = re.compile(rf"^{re.escape(key)}=.*$", re.M)
                line = f"{key}={value}"
                if pattern.search(text):
                    text = pattern.sub(line, text, count=1)
                else:
                    if text and not text.endswith("\n"):
                        text += "\n"
                    text += line + "\n"
            path.write_text(text, encoding="utf-8")
            print("step:tmp_upserted", ",".join(updates))
            PY
            run_root cp "$tmp" .env.production
            rm -f "$tmp"
            run_root grep -qE '^ASSETS_URL_SIGNING_SECRET=.+' .env.production
            run_root grep -qE '^ASSETS_URL_SIGNING_TTL_SECONDS=.+' .env.production
            run_root python3 -c 'import re,pathlib; t=pathlib.Path("/opt/steam-app/.env.production").read_text(); m=re.search(r"^ASSETS_URL_SIGNING_SECRET=(.+)$",t,re.M); assert m and len(m.group(1).strip())>=32; print("step:file_secret_len", len(m.group(1).strip()))'
            echo "step:recreate"
            docker compose up -d --force-recreate --no-deps steam-app
            for i in $(seq 1 60); do
              if docker compose exec -T steam-app node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                echo "step:healthy"
                docker compose exec -T steam-app node -e "const s=(process.env.ASSETS_URL_SIGNING_SECRET||'').trim(); console.log('step:container_secret_len', s.length); process.exit(s.length>=32?0:2)"
                echo "step:done"
                exit 0
              fi
              sleep 2
            done
            echo "steam-app health timeout" >&2
            exit 1
