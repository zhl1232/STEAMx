name: Ops Assets Signing Secret

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-assets-signing-secret
  cancel-in-progress: false

jobs:
  upsert-and-recreate:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Upsert signing env and recreate steam-app
        uses: appleboy/ssh-action@v1.2.0
        env:
          ASSETS_URL_SIGNING_SECRET: ${{ secrets.ASSETS_URL_SIGNING_SECRET }}
          ASSETS_URL_SIGNING_TTL_SECONDS: "1200"
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: ASSETS_URL_SIGNING_SECRET,ASSETS_URL_SIGNING_TTL_SECONDS
          script_stop: true
          script: echo '' | base64 -d | bash
