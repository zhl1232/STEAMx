name: Ops Assets Signing Secret

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-assets-signing-secret
  cancel-in-progress: false

jobs:
  upsert-and-recreate:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Upsert signing env and recreate steam-app
        uses: appleboy/ssh-action@v1.2.0
        env:
          ASSETS_URL_SIGNING_SECRET: ${{ secrets.ASSETS_URL_SIGNING_SECRET }}
          ASSETS_URL_SIGNING_TTL_SECONDS: "1200"
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: ASSETS_URL_SIGNING_SECRET,ASSETS_URL_SIGNING_TTL_SECONDS
          script_stop: true
          script: |
            set -euo pipefail
            test -n "${ASSETS_URL_SIGNING_SECRET:-}" || { echo "missing ASSETS_URL_SIGNING_SECRET" >&2; exit 1; }
            # hex-only secret expected; refuse otherwise to keep sed safe
            echo "${ASSETS_URL_SIGNING_SECRET}" | grep -Eq '^[0-9a-fA-F]{32,128}$' || { echo "secret format unexpected" >&2; exit 1; }
            cd /opt/steam-app
            test -f .env.production
            f=.env.production
            if grep -qE '^ASSETS_URL_SIGNING_SECRET=' "$f"; then
              sed -i "s|^ASSETS_URL_SIGNING_SECRET=.*|ASSETS_URL_SIGNING_SECRET=${ASSETS_URL_SIGNING_SECRET}|" "$f"
            else
              printf '\nASSETS_URL_SIGNING_SECRET=%s\n' "${ASSETS_URL_SIGNING_SECRET}" >> "$f"
            fi
            if grep -qE '^ASSETS_URL_SIGNING_TTL_SECONDS=' "$f"; then
              sed -i "s|^ASSETS_URL_SIGNING_TTL_SECONDS=.*|ASSETS_URL_SIGNING_TTL_SECONDS=${ASSETS_URL_SIGNING_TTL_SECONDS}|" "$f"
            else
              printf 'ASSETS_URL_SIGNING_TTL_SECONDS=%s\n' "${ASSETS_URL_SIGNING_TTL_SECONDS}" >> "$f"
            fi
            grep -qE '^ASSETS_URL_SIGNING_SECRET=.+' "$f"
            grep -qE '^ASSETS_URL_SIGNING_TTL_SECONDS=.+' "$f"
            echo "present: ASSETS_URL_SIGNING_SECRET"
            echo "present: ASSETS_URL_SIGNING_TTL_SECONDS"
            # length-only check (no value)
            python3 -c 'import re,pathlib; t=pathlib.Path(".env.production").read_text(); m=re.search(r"^ASSETS_URL_SIGNING_SECRET=(.+)$",t,re.M); assert m and len(m.group(1))>=32; print("secret_len", len(m.group(1)))'
            docker compose up -d --force-recreate --no-deps steam-app
            for i in $(seq 1 60); do
              if docker compose exec -T steam-app node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                echo "steam-app healthy"
                # confirm env inside container without printing value
                docker compose exec -T steam-app node -e "const s=process.env.ASSETS_URL_SIGNING_SECRET||''; console.log('container_secret_len', s.length); process.exit(s.length>=32?0:2)"
                exit 0
              fi
              sleep 2
            done
            echo "steam-app health timeout" >&2
            exit 1
