name: Ops Assets Signing Secret

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-assets-signing-secret
  cancel-in-progress: false

jobs:
  upsert-and-recreate:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Upsert signing env and recreate steam-app
        uses: appleboy/ssh-action@v1.2.0
        env:
          ASSETS_URL_SIGNING_SECRET: ${{ secrets.ASSETS_URL_SIGNING_SECRET }}
          ASSETS_URL_SIGNING_TTL_SECONDS: "1200"
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: ASSETS_URL_SIGNING_SECRET,ASSETS_URL_SIGNING_TTL_SECONDS
          script_stop: true
          script: |
            set -euo pipefail
            test -n "${ASSETS_URL_SIGNING_SECRET:-}" || { echo "missing ASSETS_URL_SIGNING_SECRET" >&2; exit 1; }
            cd /opt/steam-app
            test -f .env.production
            python3 -c 'import os,re,pathlib; p=pathlib.Path(".env.production"); t=p.read_text(encoding="utf-8"); u={"ASSETS_URL_SIGNING_SECRET":os.environ["ASSETS_URL_SIGNING_SECRET"],"ASSETS_URL_SIGNING_TTL_SECONDS":os.environ.get("ASSETS_URL_SIGNING_TTL_SECONDS","1200")};
for k,v in u.items():
 r=re.compile(r"^"+re.escape(k)+r"=.*$",re.M); line=f"{k}={v}";
 t=r.sub(line,t,count=1) if r.search(t) else (t+("" if t.endswith("\n") else "\n")+line+"\n");
p.write_text(t,encoding="utf-8"); print("upserted:", ", ".join(u))'
            for k in ASSETS_URL_SIGNING_SECRET ASSETS_URL_SIGNING_TTL_SECONDS; do
              grep -qE "^${k}=.+" .env.production || { echo "missing $k after upsert" >&2; exit 1; }
              echo "present: $k"
            done
            docker compose up -d --force-recreate --no-deps steam-app
            for i in $(seq 1 60); do
              if docker compose exec -T steam-app node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                echo "steam-app healthy"
                exit 0
              fi
              sleep 2
            done
            echo "steam-app health timeout" >&2
            exit 1
