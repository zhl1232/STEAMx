name: Release Deploy

on:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_ASSETS_BASE_URL: ${{ secrets.NEXT_PUBLIC_ASSETS_BASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY NEXT_PUBLIC_ASSETS_BASE_URL; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ -z "${{ secrets.SERVER_HOST }}" ]; then missing+=("SERVER_HOST"); fi
          if [ -z "${{ secrets.SERVER_USER }}" ]; then missing+=("SERVER_USER"); fi
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then missing+=("SSH_PRIVATE_KEY"); fi
          if [ ${#missing[@]} -gt 0 ]; then
            printf 'Missing secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Build Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            --build-arg NEXT_PUBLIC_ASSETS_BASE_URL="$NEXT_PUBLIC_ASSETS_BASE_URL" \
            -t steam-app:latest \
            .
          docker save steam-app:latest | gzip -3 > steam-app.tar.gz
          chmod 644 steam-app.tar.gz
          ls -lh steam-app.tar.gz
          df -h /

      - name: Copy image to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: steam-app.tar.gz
          target: /tmp/

      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            gunzip -c /tmp/steam-app.tar.gz | docker load
            rm -f /tmp/steam-app.tar.gz
            cd /opt/steam-app
            missing_runtime=""
            for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY DASHSCOPE_API_KEY; do
              if ! grep -qE "^${name}=.+" .env.production; then
                missing_runtime="$missing_runtime $name"
              fi
            done
            if [ -n "$missing_runtime" ]; then
              echo "Missing runtime variables in /opt/steam-app/.env.production:$missing_runtime" >&2
              exit 1
            fi
            docker compose up -d --force-recreate --no-build
            docker image prune -f
