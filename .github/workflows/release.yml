name: Release Deploy

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: read
  actions: write
  packages: write

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release-scope:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.scope.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether the application image changed
        id: scope
        env:
          RELEASE_BEFORE: ${{ github.event.before }}
        run: node scripts/release-scope.mjs

  build-image:
    needs: release-scope
    if: needs.release-scope.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_ASSETS_BASE_URL: ${{ secrets.NEXT_PUBLIC_ASSETS_BASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify deployment script
        run: node --test deploy/registry-deploy.test.mjs scripts/db-push.test.mjs scripts/check-seo.test.mjs

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY NEXT_PUBLIC_ASSETS_BASE_URL; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ -z "${{ secrets.SERVER_HOST }}" ]; then missing+=("SERVER_HOST"); fi
          if [ -z "${{ secrets.SERVER_USER }}" ]; then missing+=("SERVER_USER"); fi
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then missing+=("SSH_PRIVATE_KEY"); fi
          if [ ${#missing[@]} -gt 0 ]; then
            printf 'Missing secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Check available disk space
        id: disk
        shell: bash
        run: |
          available_kb=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')
          echo "Available space: $((available_kb / 1024 / 1024)) GiB"
          if [ "$available_kb" -lt 20971520 ]; then
            echo "cleanup=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space when below 20 GiB
        if: steps.disk.outputs.cleanup == 'true'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ env.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_ASSETS_BASE_URL=${{ env.NEXT_PUBLIC_ASSETS_BASE_URL }}
          cache-from: type=gha,scope=steam-app
          cache-to: type=gha,mode=max,scope=steam-app,ignore-error=true

  deploy-production:
    needs: [ci, build-image]
    runs-on: ubuntu-latest
    environment: production
    env:
      NGINX_SERVER_NAME: ${{ vars.NGINX_SERVER_NAME || 'steam.bj.cn www.steam.bj.cn steamx.cc www.steamx.cc' }}
      NGINX_SSL_CERTIFICATE: ${{ vars.NGINX_SSL_CERTIFICATE || '/etc/letsencrypt/live/steam.bj.cn/fullchain.pem' }}
      NGINX_SSL_CERTIFICATE_KEY: ${{ vars.NGINX_SSL_CERTIFICATE_KEY || '/etc/letsencrypt/live/steam.bj.cn/privkey.pem' }}
      NGINX_SITE_PATH: ${{ vars.NGINX_SITE_PATH || '/etc/nginx/sites-available/steam-app' }}
      NGINX_SITE_ENABLED_PATH: ${{ vars.NGINX_SITE_ENABLED_PATH || '/etc/nginx/sites-enabled/steam-app' }}
      DEPLOY_DIR: /tmp/steam-deploy-${{ github.run_id }}-${{ github.run_attempt }}
      # Reviewed database changes for this release. Other pending migrations fail
      # before writes; future schema changes require an explicit allowlist update.
      MIGRATION_ALLOWLIST: 20261012160000_tutor_total_usage_billing.sql,20261012170000_ai_credit_grants.sql,20261012171000_tutor_daily_credit_billing.sql,20261013090000_tutor_speech_budget.sql,20261013120000_tutor_speech_usage_limits.sql,20261013200000_ai_credit_rules_v2.sql,20261013210000_simplify_mobile_onboarding.sql
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Render Nginx config
        shell: bash
        run: |
          set -euo pipefail
          : "${NGINX_SERVER_NAME:?Missing NGINX_SERVER_NAME}"
          : "${NGINX_SSL_CERTIFICATE:?Missing NGINX_SSL_CERTIFICATE}"
          : "${NGINX_SSL_CERTIFICATE_KEY:?Missing NGINX_SSL_CERTIFICATE_KEY}"
          cp deploy/nginx.conf nginx.conf
          perl -0pi -e 's#__NGINX_SERVER_NAMES__#$ENV{NGINX_SERVER_NAME}#g; s#__NGINX_SSL_CERTIFICATE__#$ENV{NGINX_SSL_CERTIFICATE}#g; s#__NGINX_SSL_CERTIFICATE_KEY__#$ENV{NGINX_SSL_CERTIFICATE_KEY}#g' nginx.conf
          if grep -q "__NGINX_" nginx.conf; then
            echo "Rendered nginx.conf still contains template placeholders" >&2
            exit 1
          fi
          chmod 644 nginx.conf

      - name: Prepare deployment bundle
        run: |
          mkdir -p .tmp/deploy-bundle
          cp deploy/docker-compose.yml deploy/registry-deploy.sh nginx.conf .tmp/deploy-bundle/
          mkdir -p .tmp/deploy-bundle/migrations/scripts .tmp/deploy-bundle/migrations/supabase
          cp scripts/db-push.mjs .tmp/deploy-bundle/migrations/scripts/
          # Keep the complete directory so the scoped runner can detect every
          # pending migration, including changes outside the approved three.
          cp -R supabase/migrations .tmp/deploy-bundle/migrations/supabase/

      - name: Copy deployment bundle to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: .tmp/deploy-bundle/*
          target: ${{ env.DEPLOY_DIR }}
          strip_components: 2

      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_IMAGE: ${{ needs.build-image.outputs.image }}
          IMAGE_DIGEST: ${{ needs.build-image.outputs.digest }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 60m
          envs: GHCR_USERNAME,GHCR_TOKEN,REGISTRY_IMAGE,IMAGE_DIGEST,DEPLOY_DIR,NGINX_SITE_PATH,NGINX_SITE_ENABLED_PATH,MIGRATION_ALLOWLIST
          script: |
            set -eu
            trap 'rm -rf -- "$DEPLOY_DIR"' EXIT
            export CANDIDATE_COMPOSE_FILE="$DEPLOY_DIR/docker-compose.yml"
            export CANDIDATE_NGINX_FILE="$DEPLOY_DIR/nginx.conf"
            export CANDIDATE_MIGRATION_DIR="$DEPLOY_DIR/migrations"
            cd /opt/steam-app
            missing_runtime=""
            for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY DASHSCOPE_API_KEY; do
              if ! grep -qE "^${name}=.+" .env.production; then
                missing_runtime="$missing_runtime $name"
              fi
            done
            if ! grep -qE "^(CRON_SECRET|INTERNAL_API_SECRET)=.+" .env.production; then
              missing_runtime="$missing_runtime CRON_SECRET_OR_INTERNAL_API_SECRET"
            fi
            if [ -n "$missing_runtime" ]; then
              echo "Missing runtime variables in /opt/steam-app/.env.production:$missing_runtime" >&2
              exit 1
            fi
            bash "$DEPLOY_DIR/registry-deploy.sh"

      - name: Check public SEO after deployment
        id: seo-check
        timeout-minutes: 8
        run: node scripts/check-seo.mjs --base-url https://steam.bj.cn --report .tmp/seo-report.json

      - name: Save SEO check report
        if: always() && steps.seo-check.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: seo-check-${{ github.sha }}
          path: .tmp/seo-report.json
          if-no-files-found: warn
          retention-days: 30

