name: Release Deploy

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: read
  actions: write
  packages: write

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  release-scope:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.scope.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether the application image changed
        id: scope
        env:
          RELEASE_BEFORE: ${{ github.event.before }}
        run: node scripts/release-scope.mjs

  deploy-production:
    needs: release-scope
    if: needs.release-scope.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_ASSETS_BASE_URL: ${{ secrets.NEXT_PUBLIC_ASSETS_BASE_URL }}
      NGINX_SERVER_NAME: ${{ vars.NGINX_SERVER_NAME || 'steam.bj.cn www.steam.bj.cn steamx.cc www.steamx.cc' }}
      NGINX_SSL_CERTIFICATE: ${{ vars.NGINX_SSL_CERTIFICATE || '/etc/letsencrypt/live/steam.bj.cn/fullchain.pem' }}
      NGINX_SSL_CERTIFICATE_KEY: ${{ vars.NGINX_SSL_CERTIFICATE_KEY || '/etc/letsencrypt/live/steam.bj.cn/privkey.pem' }}
      NGINX_SITE_PATH: ${{ vars.NGINX_SITE_PATH || '/etc/nginx/sites-available/steam-app' }}
      NGINX_SITE_ENABLED_PATH: ${{ vars.NGINX_SITE_ENABLED_PATH || '/etc/nginx/sites-enabled/steam-app' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify deployment script
        run: node --test deploy/registry-deploy.test.mjs scripts/check-seo.test.mjs

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY NEXT_PUBLIC_ASSETS_BASE_URL; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ -z "${{ secrets.SERVER_HOST }}" ]; then missing+=("SERVER_HOST"); fi
          if [ -z "${{ secrets.SERVER_USER }}" ]; then missing+=("SERVER_USER"); fi
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then missing+=("SSH_PRIVATE_KEY"); fi
          if [ ${#missing[@]} -gt 0 ]; then
            printf 'Missing secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ env.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_ASSETS_BASE_URL=${{ env.NEXT_PUBLIC_ASSETS_BASE_URL }}
          cache-from: type=gha,scope=steam-app
          cache-to: type=gha,mode=max,scope=steam-app,ignore-error=true

      - name: Render Nginx config
        shell: bash
        run: |
          set -euo pipefail
          : "${NGINX_SERVER_NAME:?Missing NGINX_SERVER_NAME}"
          : "${NGINX_SSL_CERTIFICATE:?Missing NGINX_SSL_CERTIFICATE}"
          : "${NGINX_SSL_CERTIFICATE_KEY:?Missing NGINX_SSL_CERTIFICATE_KEY}"
          cp deploy/nginx.conf nginx.conf
          perl -0pi -e 's#__NGINX_SERVER_NAMES__#$ENV{NGINX_SERVER_NAME}#g; s#__NGINX_SSL_CERTIFICATE__#$ENV{NGINX_SSL_CERTIFICATE}#g; s#__NGINX_SSL_CERTIFICATE_KEY__#$ENV{NGINX_SSL_CERTIFICATE_KEY}#g' nginx.conf
          if grep -q "__NGINX_" nginx.conf; then
            echo "Rendered nginx.conf still contains template placeholders" >&2
            exit 1
          fi
          chmod 644 nginx.conf

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: deploy/docker-compose.yml
          target: /tmp/
          strip_components: 1

      - name: Copy Nginx config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: nginx.conf
          target: /tmp/

      - name: Copy registry deploy script to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: deploy/registry-deploy.sh
          target: /tmp/
          strip_components: 1

      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_IMAGE: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 60m
          envs: GHCR_USERNAME,GHCR_TOKEN,REGISTRY_IMAGE,IMAGE_DIGEST
          script: |
            set -eu
            run_root() {
              if [ "$(id -u)" -eq 0 ]; then
                "$@"
              else
                sudo -n "$@"
              fi
            }

            cp /tmp/docker-compose.yml /opt/steam-app/docker-compose.yml
            rm -f /tmp/docker-compose.yml
            nginx_site_path="${{ env.NGINX_SITE_PATH }}"
            nginx_site_enabled_path="${{ env.NGINX_SITE_ENABLED_PATH }}"
            nginx_backup_path=""
            if [ -f /tmp/nginx.conf ]; then
              if run_root test -f "$nginx_site_path"; then
                nginx_backup_path="${nginx_site_path}.bak.$(date +%Y%m%d%H%M%S)"
                run_root cp "$nginx_site_path" "$nginx_backup_path"
              fi
              run_root install -D -m 0644 /tmp/nginx.conf "$nginx_site_path"
              if [ "$nginx_site_enabled_path" != "$nginx_site_path" ]; then
                run_root ln -sfn "$nginx_site_path" "$nginx_site_enabled_path"
              fi
              if ! run_root nginx -t; then
                if [ -n "$nginx_backup_path" ]; then
                  run_root cp "$nginx_backup_path" "$nginx_site_path"
                  run_root nginx -t || true
                else
                  run_root rm -f "$nginx_site_path" "$nginx_site_enabled_path"
                fi
                exit 1
              fi
              run_root systemctl reload nginx
              rm -f /tmp/nginx.conf
            fi
            cd /opt/steam-app
            missing_runtime=""
            for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY DASHSCOPE_API_KEY; do
              if ! grep -qE "^${name}=.+" .env.production; then
                missing_runtime="$missing_runtime $name"
              fi
            done
            if ! grep -qE "^(CRON_SECRET|INTERNAL_API_SECRET)=.+" .env.production; then
              missing_runtime="$missing_runtime CRON_SECRET_OR_INTERNAL_API_SECRET"
            fi
            if [ -n "$missing_runtime" ]; then
              echo "Missing runtime variables in /opt/steam-app/.env.production:$missing_runtime" >&2
              exit 1
            fi
            bash /tmp/registry-deploy.sh
            rm -f /tmp/registry-deploy.sh

      - name: Check public SEO after deployment
        id: seo-check
        timeout-minutes: 8
        run: node scripts/check-seo.mjs --base-url https://steam.bj.cn --report .tmp/seo-report.json

      - name: Save SEO check report
        if: always() && steps.seo-check.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: seo-check-${{ github.sha }}
          path: .tmp/seo-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Push public URLs to Baidu
        continue-on-error: true
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
          BAIDU_PUSH_SITE: https://steam.bj.cn
          BAIDU_PUSH_CHUNK_SIZE: "10"
        run: node scripts/submit-baidu-urls.mjs
