name: Ops Auth Phone Provider

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-auth-phone-provider
  cancel-in-progress: false

jobs:
  upsert-and-recreate:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Upsert AUTH_PHONE_PROVIDER and recreate steam-app
        uses: appleboy/ssh-action@v1.2.0
        env:
          AUTH_PHONE_PROVIDER: supabase
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: AUTH_PHONE_PROVIDER
          script_stop: true
          debug: true
          script: |
            set -euo pipefail
            echo "step:start uid=$(id -u)"
            export AUTH_PHONE_PROVIDER="${AUTH_PHONE_PROVIDER:-supabase}"
            AUTH_PHONE_PROVIDER="$(printf '%s' "$AUTH_PHONE_PROVIDER" | tr -d '\r\n')"
            export AUTH_PHONE_PROVIDER
            echo "step:provider=$AUTH_PHONE_PROVIDER"
            cd /opt/steam-app
            echo "step:cwd=$(pwd)"
            test -f .env.production
            echo "step:env_file_ok"
            tmp="$(mktemp)"
            cp .env.production "$tmp"
            echo "step:tmp_copied"
            echo '' | base64 -d > /tmp/upsert_auth_phone.py
            python3 /tmp/upsert_auth_phone.py "$tmp"
            echo "step:py_done"
            grep -qE '^AUTH_PHONE_PROVIDER=supabase$' "$tmp"
            echo "step:file_ok"
            cp "$tmp" .env.production
            rm -f "$tmp" /tmp/upsert_auth_phone.py
            echo "step:env_written"
            echo "step:recreate"
            docker compose up -d --force-recreate --no-deps steam-app
            for i in $(seq 1 60); do
              if docker compose exec -T steam-app node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                echo "step:healthy"
                docker compose exec -T steam-app node -e "const v=(process.env.AUTH_PHONE_PROVIDER||'').trim(); console.log('step:container_provider', v); process.exit(v==='supabase'?0:2)"
                echo "step:done"
                exit 0
              fi
              sleep 2
            done
            echo "steam-app health timeout" >&2
            exit 1
