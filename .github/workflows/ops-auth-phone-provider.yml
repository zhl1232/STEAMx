name: Ops Auth Phone Provider

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Phone authentication provider
        required: true
        default: legacy
        type: choice
        options: [legacy, supabase]
      supabase_verified:
        description: Confirm real SMS, existing-login, and new-registration tests passed
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test deployment script
        run: node --test deploy/auth-phone-provider.test.mjs
      - name: Copy deployment script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: deploy/auth-phone-provider.sh
          strip_components: 1
          target: /tmp/steam-auth-phone-${{ github.run_id }}-${{ github.run_attempt }}/
      - name: Set provider and recreate steam-app
        uses: appleboy/ssh-action@v1.2.0
        env:
          AUTH_PHONE_PROVIDER: ${{ inputs.provider }}
          SUPABASE_VERIFIED: ${{ inputs.supabase_verified }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: AUTH_PHONE_PROVIDER,SUPABASE_VERIFIED
          script_stop: true
          script: |
            set -euo pipefail
            dir="/tmp/steam-auth-phone-${{ github.run_id }}-${{ github.run_attempt }}"
            trap 'rm -rf -- "$dir"' EXIT
            chmod 700 "$dir/auth-phone-provider.sh"
            APP_DIR=/opt/steam-app AUTH_PHONE_PROVIDER="$AUTH_PHONE_PROVIDER" SUPABASE_VERIFIED="$SUPABASE_VERIFIED" "$dir/auth-phone-provider.sh"
