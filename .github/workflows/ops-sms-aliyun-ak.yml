name: Ops SMS Aliyun AK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-sms-aliyun-ak
  cancel-in-progress: false

jobs:
  upsert-and-recreate:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Upsert SMS_ALIYUN_ACCESS_KEY_* and recreate steam-app
        uses: appleboy/ssh-action@v1.2.0
        env:
          SMS_ALIYUN_ACCESS_KEY_ID: ${{ secrets.SMS_ALIYUN_ACCESS_KEY_ID }}
          SMS_ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.SMS_ALIYUN_ACCESS_KEY_SECRET }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: SMS_ALIYUN_ACCESS_KEY_ID,SMS_ALIYUN_ACCESS_KEY_SECRET
          script_stop: true
          script: |
            set -euo pipefail
            test -n "${SMS_ALIYUN_ACCESS_KEY_ID:-}"; test -n "${SMS_ALIYUN_ACCESS_KEY_SECRET:-}"
            cd /opt/steam-app
            test -f .env.production
            cp .env.production ".env.production.bak-sms-$(date +%Y%m%d%H%M%S)"
            echo "step:backup_ok"
            echo "step:provider_before=$(grep -E '^AUTH_PHONE_PROVIDER=' .env.production | cut -d= -f2)"
            tmp="$(mktemp)"; cp .env.production "$tmp"
            echo '' | base64 -d > /tmp/upsert_sms_ak.py
            python3 /tmp/upsert_sms_ak.py "$tmp"
            test "$(grep -c '^SMS_ALIYUN_ACCESS_KEY_ID=' "$tmp")" = 1
            test "$(grep -c '^SMS_ALIYUN_ACCESS_KEY_SECRET=' "$tmp")" = 1
            cp "$tmp" .env.production; rm -f "$tmp" /tmp/upsert_sms_ak.py
            echo "step:env_written"
            docker compose up -d --force-recreate --no-deps steam-app
            for i in $(seq 1 60); do
              if docker compose exec -T steam-app node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                echo "step:healthy"
                docker compose exec -T steam-app node -e "const c=require('crypto');const i=process.env.SMS_ALIYUN_ACCESS_KEY_ID||'';const s=process.env.SMS_ALIYUN_ACCESS_KEY_SECRET||'';console.log('step:container_ak', i.slice(0,4), 'len', i.length, 'sha8', c.createHash('sha256').update(i).digest('hex').slice(0,8), 'secret_len', s.length, 'provider', process.env.AUTH_PHONE_PROVIDER)"
                echo "step:done"; exit 0
              fi
              sleep 2
            done
            echo "steam-app health timeout" >&2; exit 1
