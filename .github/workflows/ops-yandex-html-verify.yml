name: Ops Yandex HTML Verify

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-yandex-html-verify
  cancel-in-progress: false

jobs:
  place-verify-file:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Place host file, docker cp, patch live nginx
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          command_timeout: 5m
          script: |
            set -euo pipefail
            MARKER="yandex_43f97ab3236b6cfd.html"
            HOST_DIR="/opt/steam-app/static-verify"
            HOST_FILE="$HOST_DIR/$MARKER"
            SITE_PATH="${NGINX_SITE_PATH:-/etc/nginx/sites-available/steam-app}"
            STAGE="$(mktemp -d /tmp/steam-yandex-verify.XXXXXX)"
            trap 'rm -rf -- "$STAGE"' EXIT

            echo "step:start host=$(hostname) date=$(date -Is)"
            printf '%s' 'PGh0bWw+CiAgICA8aGVhZD4KICAgICAgICA8bWV0YSBodHRwLWVxdWl2PSJDb250ZW50LVR5cGUiIGNvbnRlbnQ9InRleHQvaHRtbDsgY2hhcnNldD1VVEYtOCI+CiAgICA8L2hlYWQ+CiAgICA8Ym9keT5WZXJpZmljYXRpb246IDQzZjk3YWIzMjM2YjZjZmQ8L2JvZHk+CjwvaHRtbD4K' | base64 -d > "$STAGE/$MARKER"
            test -f "$STAGE/$MARKER"
            echo "step:src_bytes=$(wc -c < "$STAGE/$MARKER")"
            grep -q 'Verification: 43f97ab3236b6cfd' "$STAGE/$MARKER"

            mkdir -p "$HOST_DIR"
            chmod 755 /opt/steam-app "$HOST_DIR" || true
            install -m 0644 "$STAGE/$MARKER" "$HOST_FILE"
            echo "step:host_file=$HOST_FILE bytes=$(wc -c < "$HOST_FILE")"
            ls -lad /opt/steam-app "$HOST_DIR" "$HOST_FILE" || true
            # Ensure nginx user can traverse; also copy to /var/www for fallback readability
            mkdir -p /var/www/steam-verify
            chmod 755 /var/www /var/www/steam-verify || true
            install -m 0644 "$STAGE/$MARKER" "/var/www/steam-verify/$MARKER"
            echo "step:www_copy=/var/www/steam-verify/$MARKER"

            echo "step:docker_cp"
            cd /opt/steam-app
            CID="$(docker compose ps -q steam-app 2>/dev/null || true)"
            if [ -z "$CID" ]; then
              CID="$(docker ps --filter name=steam-app --format '{{.ID}}' | head -n1 || true)"
            fi
            test -n "$CID"
            echo "step:container_id=$CID"
            docker cp "$HOST_FILE" "$CID:/app/public/$MARKER"
            docker exec "$CID" sh -lc "test -f /app/public/$MARKER && grep -q 'Verification: 43f97ab3236b6cfd' /app/public/$MARKER && wc -c /app/public/$MARKER"
            echo "step:docker_cp_ok"

            # Also probe whether Next serves the file directly via loopback :3000
            echo "step:next_direct"
            NEXT_STATUS="$(curl -sS --max-time 10 -o /tmp/yandex_next.html -w '%{http_code}' http://127.0.0.1:3000/$MARKER || true)"
            echo "step:next_status=$NEXT_STATUS"
            head -c 200 /tmp/yandex_next.html || true
            echo

            echo "step:nginx_site=$SITE_PATH"
            test -f "$SITE_PATH"
            ls -la "$SITE_PATH" /etc/nginx/sites-enabled/steam-app 2>/dev/null || true
            echo "step:location_slash_count=$(grep -c 'location / {' "$SITE_PATH" || true)"
            echo "step:pre_patch_snip"
            grep -nE 'yandex_43f97ab3236b6cfd|location /|所有请求代理' "$SITE_PATH" | head -n 40 || true

            printf '%s' '' | base64 -d > "$STAGE/patch.py"
            # Prefer alias to /var/www copy (world-readable path)
            sed -i 's#alias /opt/steam-app/static-verify/yandex_43f97ab3236b6cfd.html;#alias /var/www/steam-verify/yandex_43f97ab3236b6cfd.html;#' "$STAGE/patch.py"
            python3 "$STAGE/patch.py" "$SITE_PATH"

            echo "step:nginx_T_yandex"
            nginx -T 2>/dev/null | grep -n 'yandex_43f97ab3236b6cfd\|steam-verify' || echo "step:WARN_not_in_nginx_T"

            echo "step:nginx_test"
            nginx -t
            if systemctl is-active --quiet nginx; then
              systemctl reload nginx
            else
              nginx -s reload
            fi
            echo "step:nginx_reloaded"

            echo "step:curl_local"
            curl -sS --max-time 20 -D /tmp/yandex_hdrs.txt -o /tmp/yandex_verify_body.html               "https://127.0.0.1/$MARKER" -H 'Host: steam.bj.cn' -k || true
            echo "step:local_headers"; head -n 20 /tmp/yandex_hdrs.txt || true
            STATUS="$(awk 'NR==1{print $2}' /tmp/yandex_hdrs.txt || true)"
            echo "step:local_status=$STATUS"
            head -c 500 /tmp/yandex_verify_body.html || true
            echo

            if [ "${STATUS:-}" != "200" ] || ! grep -q 'Verification: 43f97ab3236b6cfd' /tmp/yandex_verify_body.html; then
              echo "step:retry_public_curl"
              curl -sS --max-time 20 -D /tmp/yandex_hdrs.txt -o /tmp/yandex_verify_body.html                 "https://steam.bj.cn/$MARKER" || true
              echo "step:public_headers"; head -n 20 /tmp/yandex_hdrs.txt || true
              STATUS="$(awk 'NR==1{print $2}' /tmp/yandex_hdrs.txt || true)"
              echo "step:public_status=$STATUS"
              head -c 500 /tmp/yandex_verify_body.html || true
              echo
            fi

            test "${STATUS:-}" = "200"
            grep -q 'Verification: 43f97ab3236b6cfd' /tmp/yandex_verify_body.html
            if grep -q '_next/static' /tmp/yandex_verify_body.html; then
              echo "step:got_next_shell_not_verify" >&2
              exit 1
            fi
            echo "step:done host_path=/opt/steam-app/static-verify/$MARKER www_path=/var/www/steam-verify/$MARKER"
