name: Ops Yandex HTML Verify

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-yandex-html-verify
  cancel-in-progress: false

jobs:
  place-verify-file:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Place host file, docker cp, patch live nginx
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          command_timeout: 5m
          script: |
            set -euo pipefail
            MARKER="yandex_43f97ab3236b6cfd.html"
            HOST_DIR="/opt/steam-app/static-verify"
            HOST_FILE="$HOST_DIR/$MARKER"
            SITE_PATH="${NGINX_SITE_PATH:-/etc/nginx/sites-available/steam-app}"
            SITE_ENABLED="${NGINX_SITE_ENABLED_PATH:-/etc/nginx/sites-enabled/steam-app}"
            STAGE="$(mktemp -d /tmp/steam-yandex-verify.XXXXXX)"
            trap 'rm -rf -- "$STAGE"' EXIT

            echo "step:start host=$(hostname) date=$(date -Is)"
            printf '%s' 'PGh0bWw+CiAgICA8aGVhZD4KICAgICAgICA8bWV0YSBodHRwLWVxdWl2PSJDb250ZW50LVR5cGUiIGNvbnRlbnQ9InRleHQvaHRtbDsgY2hhcnNldD1VVEYtOCI+CiAgICA8L2hlYWQ+CiAgICA8Ym9keT5WZXJpZmljYXRpb246IDQzZjk3YWIzMjM2YjZjZmQ8L2JvZHk+CjwvaHRtbD4K' | base64 -d > "$STAGE/$MARKER"
            test -f "$STAGE/$MARKER"
            echo "step:src_bytes=$(wc -c < "$STAGE/$MARKER")"
            grep -q 'Verification: 43f97ab3236b6cfd' "$STAGE/$MARKER"

            mkdir -p "$HOST_DIR"
            # URI /yandex_....html with root /opt/steam-app/static-verify resolves to
            # /opt/steam-app/static-verify/yandex_....html — keep filename at that path.
            install -m 0644 "$STAGE/$MARKER" "$HOST_FILE"
            echo "step:host_file=$HOST_FILE bytes=$(wc -c < "$HOST_FILE") ls=$(ls -la "$HOST_FILE")"
            grep -q 'Verification: 43f97ab3236b6cfd' "$HOST_FILE"

            echo "step:docker_cp"
            cd /opt/steam-app
            CID="$(docker compose ps -q steam-app 2>/dev/null || true)"
            if [ -z "$CID" ]; then
              CID="$(docker ps --filter name=steam-app --format '{{.ID}}' | head -n1 || true)"
            fi
            test -n "$CID"
            echo "step:container_id=$CID"
            docker cp "$HOST_FILE" "$CID:/app/public/$MARKER"
            docker exec "$CID" sh -lc "test -f /app/public/$MARKER && grep -q 'Verification: 43f97ab3236b6cfd' /app/public/$MARKER && wc -c /app/public/$MARKER"
            echo "step:docker_cp_ok"

            echo "step:nginx_paths available=$SITE_PATH enabled=$SITE_ENABLED"
            ls -la "$SITE_PATH" "$SITE_ENABLED" 2>/dev/null || true
            if [ -L "$SITE_ENABLED" ]; then
              echo "step:enabled_symlink -> $(readlink -f "$SITE_ENABLED")"
            fi
            printf '%s' '' | base64 -d > "$STAGE/patch-yandex-nginx.py"
            # Patch available + enabled (if distinct) + any conf.d steam-app
            EXTRA=""
            for p in /etc/nginx/conf.d/steam-app.conf /etc/nginx/conf.d/steam.conf; do
              [ -f "$p" ] && EXTRA="$EXTRA $p"
            done
            python3 "$STAGE/patch-yandex-nginx.py" "$SITE_PATH" "$SITE_ENABLED" $EXTRA

            echo "step:nginx_T_yandex"
            nginx -T 2>/dev/null | grep -n "yandex_43f97ab3236b6cfd" || echo "step:WARN_not_in_nginx_T"

            echo "step:nginx_test"
            nginx -t
            echo "step:nginx_reload"
            if systemctl is-active --quiet nginx; then
              systemctl reload nginx
            else
              nginx -s reload
            fi
            echo "step:nginx_reloaded"

            echo "step:local_curl"
            STATUS="$(curl -sS --max-time 20 -o /tmp/yandex_verify_body.html -w '%{http_code}' https://127.0.0.1/$MARKER -H 'Host: steam.bj.cn' -k || true)"
            echo "step:local_status=$STATUS"
            head -c 500 /tmp/yandex_verify_body.html || true
            echo
            if [ "$STATUS" != "200" ] || ! grep -q 'Verification: 43f97ab3236b6cfd' /tmp/yandex_verify_body.html; then
              echo "step:retry_public_curl"
              STATUS="$(curl -sS --max-time 20 -o /tmp/yandex_verify_body.html -w '%{http_code}' https://steam.bj.cn/$MARKER || true)"
              echo "step:public_status=$STATUS"
              head -c 500 /tmp/yandex_verify_body.html || true
              echo
            fi
            test "$STATUS" = "200"
            grep -q 'Verification: 43f97ab3236b6cfd' /tmp/yandex_verify_body.html
            # Must not be Next 404 shell
            if grep -q '_next/static' /tmp/yandex_verify_body.html; then
              echo "step:got_next_shell_not_verify" >&2
              exit 1
            fi
            echo "step:done"
