name: Ops Yandex HTML Verify

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-yandex-html-verify
  cancel-in-progress: false

jobs:
  place-verify-file:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Place host file, docker cp, patch live nginx
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          command_timeout: 5m
          script: |
            set -euo pipefail
            MARKER="yandex_43f97ab3236b6cfd.html"
            HOST_DIR="/opt/steam-app/static-verify"
            HOST_FILE="$HOST_DIR/$MARKER"
            SITE_PATH="${NGINX_SITE_PATH:-/etc/nginx/sites-available/steam-app}"
            STAGE="$(mktemp -d /tmp/steam-yandex-verify.XXXXXX)"
            trap 'rm -rf -- "$STAGE"' EXIT

            echo "step:start host=$(hostname) date=$(date -Is)"
            printf '%s' 'PGh0bWw+CiAgICA8aGVhZD4KICAgICAgICA8bWV0YSBodHRwLWVxdWl2PSJDb250ZW50LVR5cGUiIGNvbnRlbnQ9InRleHQvaHRtbDsgY2hhcnNldD1VVEYtOCI+CiAgICA8L2hlYWQ+CiAgICA8Ym9keT5WZXJpZmljYXRpb246IDQzZjk3YWIzMjM2YjZjZmQ8L2JvZHk+CjwvaHRtbD4K' | base64 -d > "$STAGE/$MARKER"
            test -f "$STAGE/$MARKER"
            echo "step:src_bytes=$(wc -c < "$STAGE/$MARKER")"
            grep -q 'Verification: 43f97ab3236b6cfd' "$STAGE/$MARKER"

            mkdir -p "$HOST_DIR"
            chmod 755 /opt/steam-app "$HOST_DIR" || true
            install -m 0644 "$STAGE/$MARKER" "$HOST_FILE"
            echo "step:host_file=$HOST_FILE bytes=$(wc -c < "$HOST_FILE")"
            ls -lad /opt/steam-app "$HOST_DIR" "$HOST_FILE"
            grep -q 'Verification: 43f97ab3236b6cfd' "$HOST_FILE"

            echo "step:docker_cp"
            cd /opt/steam-app
            CID="$(docker compose ps -q steam-app 2>/dev/null || true)"
            if [ -z "$CID" ]; then
              CID="$(docker ps --filter name=steam-app --format '{{.ID}}' | head -n1 || true)"
            fi
            test -n "$CID"
            echo "step:container_id=$CID"
            docker cp "$HOST_FILE" "$CID:/app/public/$MARKER"
            docker exec "$CID" sh -lc "test -f /app/public/$MARKER && grep -q 'Verification: 43f97ab3236b6cfd' /app/public/$MARKER && wc -c /app/public/$MARKER"
            echo "step:docker_cp_ok"

            echo "step:nginx_site=$SITE_PATH"
            test -f "$SITE_PATH"
            ls -la "$SITE_PATH" /etc/nginx/sites-enabled/steam-app 2>/dev/null || true
            echo "step:location_slash_count=$(grep -c 'location / {' "$SITE_PATH" || true)"
            echo "step:existing_yandex_lines"
            grep -n 'yandex_43f97ab3236b6cfd\|location /' "$SITE_PATH" | head -n 40 || true

            if grep -q 'location = /yandex_43f97ab3236b6cfd.html' "$SITE_PATH"; then
              echo "step:nginx_location_already_present_rewriting"
              # Remove any prior yandex exact-match location block (non-greedy via awk)
              awk '
                BEGIN {skip=0}
                /location = \/yandex_43f97ab3236b6cfd\.html[[:space:]]*\{/ {skip=1; next}
                skip==1 && /\}/ {skip=0; next}
                skip==1 {next}
                {print}
              ' "$SITE_PATH" > "$STAGE/site.cleaned"
              cp "$STAGE/site.cleaned" "$SITE_PATH"
            fi

            echo "step:nginx_patch_insert"
            BLOCK_FILE="$STAGE/yandex.location"
            cat > "$BLOCK_FILE" <<'BLOCK'
                location = /yandex_43f97ab3236b6cfd.html {
                    alias /opt/steam-app/static-verify/yandex_43f97ab3236b6cfd.html;
                    default_type text/html;
                    charset utf-8;
                    add_header Cache-Control "no-store";
                }
            BLOCK
            # Strip the accidental leading indent from heredoc if any (keep 4-space nginx indent)
            sed -i 's/^                /    /' "$BLOCK_FILE"

            python3 - "$SITE_PATH" "$BLOCK_FILE" <<'PY'
            import pathlib, sys
            site = pathlib.Path(sys.argv[1])
            block = pathlib.Path(sys.argv[2]).read_text(encoding="utf-8")
            if not block.endswith("\n"):
                block += "\n"
            text = site.read_text(encoding="utf-8")
            needle = "    # 所有请求代理到 Next.js\n    location / {"
            if needle in text:
                text = text.replace(needle, block + "\n" + needle, 1)
                where = "before_chinese_comment"
            else:
                idx = text.rfind("\n    location / {")
                if idx < 0:
                    raise SystemExit("no catch-all location / found")
                text = text[: idx + 1] + block + "\n" + text[idx + 1 :]
                where = "before_last_location_slash"
            site.write_text(text, encoding="utf-8")
            print("step:nginx_patched where=" + where)
            PY

            echo "step:post_patch_snip"
            grep -n 'yandex_43f97ab3236b6cfd\|所有请求代理\|location /' "$SITE_PATH" | head -n 50 || true

            echo "step:nginx_T_yandex"
            nginx -T 2>/dev/null | grep -n 'yandex_43f97ab3236b6cfd' || echo "step:WARN_not_in_nginx_T"

            echo "step:nginx_test"
            nginx -t
            if systemctl is-active --quiet nginx; then
              systemctl reload nginx
            else
              nginx -s reload
            fi
            echo "step:nginx_reloaded"

            echo "step:curl_verbose_local"
            curl -sS --max-time 20 -D /tmp/yandex_hdrs.txt -o /tmp/yandex_verify_body.html               https://127.0.0.1/$MARKER -H 'Host: steam.bj.cn' -k || true
            echo "step:local_headers"; head -n 20 /tmp/yandex_hdrs.txt || true
            STATUS="$(awk 'NR==1{print $2}' /tmp/yandex_hdrs.txt)"
            echo "step:local_status=$STATUS"
            head -c 500 /tmp/yandex_verify_body.html || true
            echo

            if [ "${STATUS:-}" != "200" ] || ! grep -q 'Verification: 43f97ab3236b6cfd' /tmp/yandex_verify_body.html; then
              echo "step:retry_public_curl"
              curl -sS --max-time 20 -D /tmp/yandex_hdrs.txt -o /tmp/yandex_verify_body.html                 "https://steam.bj.cn/$MARKER" || true
              echo "step:public_headers"; head -n 20 /tmp/yandex_hdrs.txt || true
              STATUS="$(awk 'NR==1{print $2}' /tmp/yandex_hdrs.txt)"
              echo "step:public_status=$STATUS"
              head -c 500 /tmp/yandex_verify_body.html || true
              echo
            fi

            test "${STATUS:-}" = "200"
            grep -q 'Verification: 43f97ab3236b6cfd' /tmp/yandex_verify_body.html
            if grep -q '_next/static' /tmp/yandex_verify_body.html; then
              echo "step:got_next_shell_not_verify" >&2
              exit 1
            fi
            echo "step:done"
