name: Ops Readonly Media Inspect
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ops-readonly-moderation-logs
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    steps:
      - name: Read-only moderation/media-analysis logs
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 30s
          command_timeout: 6m
          script: |
            echo '' | base64 -d > /tmp/ops_ro_mod.sh
            bash /tmp/ops_ro_mod.sh; rc=$?; rm -f /tmp/ops_ro_mod.sh; exit $rc
