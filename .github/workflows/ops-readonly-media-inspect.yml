name: Ops Readonly Media Inspect

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-readonly-user-18813
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    steps:
      - name: Readonly - user 8635 inspect + backup (no delete)
        timeout-minutes: 13
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 30s
          command_timeout: 12m
          script_stop: true
          script: |
            set -euo pipefail
            echo '' | base64 -d > /tmp/ops_ro_user8635.sh
            chmod 700 /tmp/ops_ro_user8635.sh
            rc=0; bash /tmp/ops_ro_user8635.sh || rc=$?
            rm -f /tmp/ops_ro_user8635.sh
            exit $rc
