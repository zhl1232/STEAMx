name: Ops Readonly Media Inspect

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-retire-907-delete
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 8
    steps:
      - name: Retire-907 phase A (dry-run, readonly + backup)
        timeout-minutes: 7
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 30s
          command_timeout: 5m
          script_stop: true
          script: |
            set -euo pipefail
            echo '' | base64 -d > /tmp/ops_readonly_step.sh
            chmod 700 /tmp/ops_readonly_step.sh
            rc=0; bash /tmp/ops_readonly_step.sh || rc=$?
            rm -f /tmp/ops_readonly_step.sh
            exit $rc
