name: Ops Readonly Media Inspect

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-readonly-media-inspect
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Read-only prod env names + nginx mtime
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          command_timeout: 5m
          script: |
            set -euo pipefail
            echo "step:start host=$(hostname) date=$(date -Is)"
            echo "step:env_file"
            test -f /opt/steam-app/.env.production
            echo "step:env_keys_begin"
            grep -E '^(ALIYUN_OSS_|ASSETS_|NEXT_PUBLIC_ASSETS_|CDN_|OSS_|S3_|COS_|BUCKET_|ENDPOINT_|.*SIGN.*|.*VIDEO.*|.*MEDIA.*)' /opt/steam-app/.env.production | while IFS= read -r line; do
              k="${line%%=*}"
              v="${line#*=}"
              case "$k" in
                *SECRET*|*KEY*|*TOKEN*|*PASSWORD*|*PASS*)
                  echo "${k}=***masked*** len=${#v}"
                  ;;
                *BUCKET*|*REGION*|*ENDPOINT*|*BASE_URL*|*DISPLAY_MODE*|*TTL_SECONDS*|*TTL*)
                  echo "${k}=${v}"
                  ;;
                *)
                  echo "${k}=***masked*** len=${#v}"
                  ;;
              esac
            done
            echo "step:env_keys_end"
            echo "step:docker_env"
            CID=$(docker ps --filter name=steam-app --format '{{.ID}}' | head -1 || true)
            echo "step:steam_app_cid=${CID:-none}"
            if [ -n "${CID:-}" ]; then
              docker exec "$CID" printenv | grep -E 'OSS|CDN|ASSET|BUCKET|ENDPOINT|SIGN|VIDEO|MEDIA|ASSETS' | sed -E 's/(SECRET|KEY|TOKEN|PASSWORD|PASS)=.*/\1=***masked***/I' | sed -E 's/^([^=]*(BASE_URL|BUCKET|REGION|ENDPOINT|DISPLAY_MODE|TTL_SECONDS)[^=]*)=.*/\0/; t; s/=.*/=***masked***/' || true
            fi
            echo "step:nginx"
            for p in /etc/nginx/sites-enabled/steam /etc/nginx/sites-enabled/steam-app /etc/nginx/sites-enabled/default /etc/nginx/conf.d/steam.conf /opt/steam-app/nginx.conf /etc/nginx/sites-available/steam; do
              if [ -e "$p" ]; then
                echo "step:nginx_path=$p"
                ls -la --time-style=long-iso "$p" || true
                stat -c 'step:mtime=%y path=%n' "$p" 2>/dev/null || true
              fi
            done
            echo "step:nginx_grep_media"
            if [ -f /opt/steam-app/nginx.conf ]; then
              grep -nE 'location|proxy_pass|assets|media|mp4|steamx|Range' /opt/steam-app/nginx.conf | head -80 || true
              stat -c 'step:app_nginx_mtime=%y' /opt/steam-app/nginx.conf || true
            fi
            if [ -f /etc/nginx/sites-enabled/steam ]; then
              grep -nE 'location|proxy_pass|assets|media|mp4|steamx|Range' /etc/nginx/sites-enabled/steam | head -80 || true
            fi
            echo "step:nginx_mtime_recent"
            find /etc/nginx /opt/steam-app -maxdepth 3 -name '*.conf' -mtime -10 -printf 'step:recent_conf %TY-%Tm-%Td %TH:%TM %p\n' 2>/dev/null || true
            echo "step:done"
