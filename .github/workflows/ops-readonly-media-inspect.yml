name: Ops Readonly Media Inspect

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-add-dashscope-ws
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    steps:
      - name: Add DASHSCOPE_WORKSPACE_ID to prod env + recreate steam-app (user-confirmed)
        uses: appleboy/ssh-action@v1.2.0
        env:
          WSID: ${{ secrets.DASHSCOPE_WORKSPACE_ID }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 30s
          command_timeout: 12m
          envs: WSID
          script: |
            set -eu
            echo '' | base64 -d > /tmp/ops_dsws.sh
            chmod 700 /tmp/ops_dsws.sh
            rc=0; WSID="$WSID" bash /tmp/ops_dsws.sh || rc=$?
            rm -f /tmp/ops_dsws.sh
            exit $rc
