name: Ops Readonly Media Inspect
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-production
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    steps:
      - name: Probe vision models + switch if working (user-approved)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 30s
          command_timeout: 12m
          script: |
            echo '' | base64 -d > /tmp/ops_vm.sh
            rc=0; bash /tmp/ops_vm.sh || rc=$?
            rm -f /tmp/ops_vm.sh
            exit $rc
