name: Ops Readonly Media Inspect

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-readonly-media-inspect
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Read-only prod sitemap googlebot probe
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          command_timeout: 5m
          script: |
            set -euo pipefail
            echo '' | base64 -d > /tmp/readonly_sms_probe.sh
            chmod +x /tmp/readonly_sms_probe.sh
            bash /tmp/readonly_sms_probe.sh
            rm -f /tmp/readonly_sms_probe.sh
