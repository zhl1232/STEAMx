name: Ops Readonly Media Inspect
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ops-readonly-media-inspect
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: Production
    steps:
      - name: Run
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          timeout: 30s
          command_timeout: 2m
          script_stop: true
          script: |
            echo "===== step:start"
            echo "" | base64 -d > /tmp/memcheck.sh
            chmod +x /tmp/memcheck.sh
            bash /tmp/memcheck.sh
            rm -f /tmp/memcheck.sh
            echo "===== step:done"
