name: Ops Readonly Media Inspect

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-readonly-media-inspect
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 4
    steps:
      - name: Readonly - hourly memcheck
        timeout-minutes: 3
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 30s
          command_timeout: 2m
          script_stop: true
          script: |
            set -euo pipefail
            echo '' | base64 -d > /tmp/memcheck.sh
            chmod 700 /tmp/memcheck.sh
            rc=0; bash /tmp/memcheck.sh || rc=$?
            rm -f /tmp/memcheck.sh
            exit $rc