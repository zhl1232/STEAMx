name: Ops Readonly Media Inspect

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-readonly-media-inspect
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Readonly - steam-app nginx verification history
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          command_timeout: 5m
          script: |
            set -euo pipefail
            echo '' | base64 -d > /tmp/ops_readonly_step.sh
            chmod 700 /tmp/ops_readonly_step.sh
            rc=0; bash /tmp/ops_readonly_step.sh || rc=$?
            rm -f /tmp/ops_readonly_step.sh
            exit $rc
