name: Ops Readonly Media Inspect

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-readonly-media-inspect
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Deploy wenyan server (isolated /opt/wenyan)
        uses: appleboy/ssh-action@v1.2.0
        env:
          WENYAN_API_KEY: ${{ secrets.WENYAN_API_KEY }}
          WENYAN_WECHAT_APP_ID: ${{ secrets.WENYAN_WECHAT_APP_ID }}
          WENYAN_WECHAT_APP_SECRET: ${{ secrets.WENYAN_WECHAT_APP_SECRET }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: WENYAN_API_KEY,WENYAN_WECHAT_APP_ID,WENYAN_WECHAT_APP_SECRET
          script_stop: true
          command_timeout: 25m
          script: |
            set -euo pipefail
            echo '' | base64 -d > /tmp/ops_wenyan_step.sh
            chmod 700 /tmp/ops_wenyan_step.sh
            rc=0; bash /tmp/ops_wenyan_step.sh || rc=$?
            rm -f /tmp/ops_wenyan_step.sh
            exit $rc
