name: Ops Readonly Media Inspect

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-readonly-vision-403
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    steps:
      - name: Read-only DashScope vision/moderation 403 diagnosis
        timeout-minutes: 12
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 30s
          command_timeout: 10m
          script_stop: true
          script: |
            set -euo pipefail
            echo '' | base64 -d > /tmp/ops_vision_403_ro.sh
            chmod 700 /tmp/ops_vision_403_ro.sh
            rc=0; bash /tmp/ops_vision_403_ro.sh || rc=$?
            rm -f /tmp/ops_vision_403_ro.sh
            exit $rc
