name: Server Diagnostics

on:
  workflow_dispatch:
    inputs:
      mode:
        description: diagnose or fix
        required: true
        default: fix
        type: choice
        options:
          - diagnose
          - fix

permissions:
  contents: read
  packages: read

concurrency:
  group: server-diagnostics
  cancel-in-progress: true

jobs:
  diagnose:
    if: ${{ inputs.mode == 'diagnose' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Production host diagnostics
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 5m
          script: |
            set -eu
            echo "=== host / time ==="
            hostname; date -Is; uptime
            echo "=== disk ==="
            df -h /
            echo "=== memory ==="
            free -h || true
            echo "=== docker ps ==="
            docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' || true
            echo "=== pull-related processes ==="
            ps -eo pid=,args= | grep -E 'registry-deploy|docker pull ghcr' | grep -v grep || echo '(none)'
            echo "=== health ==="
            curl -sS -m 5 http://127.0.0.1:3000/api/health || true
            echo

  fix:
    if: ${{ inputs.mode == 'fix' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Clear stuck pull, probe GHCR, nginx WeChat verify
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 15m
          envs: GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -u
            echo "=== kill orphaned deploy/pull by PID ==="
            self=$$
            ps -eo pid=,args= | while read -r pid args; do
              case "$pid" in "$self"|"$PPID") continue ;; esac
              case "$args" in
                *'/tmp/registry-deploy.sh'*) echo "kill registry-deploy pid=$pid"; kill "$pid" 2>/dev/null || true ;;
                *'docker pull ghcr.io/zhl1232/steamx'@*) echo "kill docker-pull pid=$pid"; kill "$pid" 2>/dev/null || true ;;
                *"IMAGE_DIGEST='sha256:"*) echo "kill leftover-deploy-bash pid=$pid"; kill "$pid" 2>/dev/null || true ;;
              esac
            done
            sleep 2
            echo "=== remaining ==="
            ps -eo pid=,args= | grep -E 'registry-deploy|docker pull ghcr' | grep -v grep || echo '(none)'

            echo "=== memory / disk ==="
            free -h || true
            df -h /

            echo "=== network ==="
            getent hosts ghcr.io || true
            curl -sS -o /dev/null -w 'ghcr_https %{http_code} time=%{time_total}\n' --connect-timeout 10 --max-time 30 https://ghcr.io/v2/ || true
            curl -sS -o /dev/null -w 'github_https %{http_code} time=%{time_total}\n' --connect-timeout 10 --max-time 30 https://github.com/ || true

            echo "=== nginx WeChat MP verify ==="
            run_root() { if [ "$(id -u)" -eq 0 ]; then "$@"; else sudo -n "$@"; fi; }
            verify_dir=/opt/steam-app/verify
            verify_file=$verify_dir/MP_verify_DALZUpUiOCb2WHb9.txt
            run_root mkdir -p "$verify_dir"
            printf '%s' 'DALZUpUiOCb2WHb9' | run_root tee "$verify_file" >/dev/null
            run_root chmod 644 "$verify_file"
            snip=/etc/nginx/snippets/steam-mp-verify.conf
            run_root tee "$snip" >/dev/null <<'NGX'
location = /MP_verify_DALZUpUiOCb2WHb9.txt {
    default_type text/plain;
    alias /opt/steam-app/verify/MP_verify_DALZUpUiOCb2WHb9.txt;
}
NGX
            site=/etc/nginx/sites-available/steam-app
            if ! run_root grep -q 'steam-mp-verify.conf' "$site"; then
              run_root cp "$site" "$site.bak.mpverify.$(date +%Y%m%d%H%M%S)"
              run_root python3 - <<'PY'
from pathlib import Path
path = Path('/etc/nginx/sites-available/steam-app')
text = path.read_text()
needle = 'location /api/upload'
include = '    include /etc/nginx/snippets/steam-mp-verify.conf;\n\n    '
if 'steam-mp-verify.conf' not in text:
    if needle in text:
        text = text.replace(needle, include + needle, 1)
    else:
        text = text.replace('client_max_body_size 50M;', 'client_max_body_size 50M;\n\n    include /etc/nginx/snippets/steam-mp-verify.conf;', 1)
    path.write_text(text)
print('nginx site updated')
PY
            fi
            run_root nginx -t
            run_root systemctl reload nginx
            curl -sS -m 5 -o /dev/null -w 'mp_http %{http_code}\n' -H 'Host: steam.bj.cn' http://127.0.0.1/MP_verify_DALZUpUiOCb2WHb9.txt || true
            curl -sS -m 5 -H 'Host: steam.bj.cn' http://127.0.0.1/MP_verify_DALZUpUiOCb2WHb9.txt || true
            echo

            echo "=== timed docker pull probe (90s) ==="
            login_config="$(mktemp -d)"
            export DOCKER_CONFIG="$login_config"
            set +e
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin >/dev/null
            login_rc=$?
            echo "docker_login_exit=$login_rc"
            if [ "$login_rc" -eq 0 ]; then
              timeout 90 docker pull 'ghcr.io/zhl1232/steamx@sha256:5ebbf5536784e12a122c337daa4f705ee5eb57c62877ca7993ba7920c8a5fef0'
              echo "pull_probe_exit=$? (124=timeout)"
            else
              echo 'skip pull: login failed'
            fi
            set -e
            rm -rf "$login_config"
            docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
