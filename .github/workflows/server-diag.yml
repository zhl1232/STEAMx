name: Server Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-diagnostics
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Production host diagnostics
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 5m
          script: |
            set -eu
            echo "=== host / time ==="
            hostname; date -Is; uptime
            echo "=== disk ==="
            df -h / /var/lib/docker 2>/dev/null || df -h /
            echo "=== memory ==="
            free -h || true
            echo "=== docker ps ==="
            docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' || true
            echo "=== docker system df ==="
            docker system df || true
            echo "=== pull/compose processes ==="
            ps auxww | grep -E '[d]ocker|[c]ompose|[r]egistry-deploy' || true
            echo "=== recent docker events (5m) ==="
            docker events --since 5m --until 0s 2>/dev/null | tail -50 || true
            echo "=== health local ==="
            curl -sS -m 5 http://127.0.0.1:3000/api/health || true
            echo
            echo "=== mp verify via localhost ==="
            curl -sS -m 5 -o /dev/null -w 'mp %{http_code}\n' http://127.0.0.1:3000/MP_verify_DALZUpUiOCb2WHb9.txt || true
