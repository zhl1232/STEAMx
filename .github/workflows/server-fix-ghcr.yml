name: Server Fix GHCR

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: server-fix-ghcr
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Clear stuck pull, probe GHCR, drop WeChat verify
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 15m
          envs: GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -eu
            echo "=== kill orphaned deploy/pull from cancelled Release ==="
            # Do not kill dockerd. Only orphaned deploy shells / docker pull clients.
            ps auxww | grep -E 'registry-deploy\.sh|docker pull ghcr\.io/zhl1232/steamx' | grep -v grep || true
            pkill -f 'bash /tmp/registry-deploy.sh' 2>/dev/null || true
            pkill -f 'docker pull ghcr.io/zhl1232/steamx' 2>/dev/null || true
            # Parent appleboy bash leftover from cancelled job (contains IMAGE_DIGEST=)
            for pid in $(pgrep -f "IMAGE_DIGEST='sha256:" || true); do
              echo "killing leftover deploy bash pid=$pid"
              kill "$pid" 2>/dev/null || true
            done
            sleep 2
            echo "=== remaining pull-related ==="
            ps auxww | grep -E 'registry-deploy|docker pull ghcr' | grep -v grep || echo '(none)'

            echo "=== memory / disk ==="
            free -h || true
            df -h /

            echo "=== network to ghcr.io ==="
            getent hosts ghcr.io || true
            curl -sS -o /dev/null -w 'ghcr_https %{http_code} time=%{time_total}\n' --connect-timeout 10 --max-time 30 https://ghcr.io/v2/ || true
            curl -sS -o /dev/null -w 'github_https %{http_code} time=%{time_total}\n' --connect-timeout 10 --max-time 30 https://github.com/ || true

            echo "=== timed docker pull probe (90s) ==="
            login_config="$(mktemp -d)"
            export DOCKER_CONFIG="$login_config"
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin >/dev/null
            set +e
            timeout 90 docker pull ghcr.io/zhl1232/steamx@sha256:5ebbf5536784e12a122c337daa4f705ee5eb57c62877ca7993ba7920c8a5fef0
            pull_rc=$?
            set -e
            echo "pull_probe_exit=$pull_rc (124=timeout)"
            rm -rf "$login_config"

            echo "=== drop WeChat MP verify into running container public ==="
            tmp="$(mktemp)"
            printf '%s' 'DALZUpUiOCb2WHb9' >"$tmp"
            if docker ps --format '{{.Names}}' | grep -qx steam-app; then
              docker cp "$tmp" steam-app:/app/public/MP_verify_DALZUpUiOCb2WHb9.txt
              docker exec steam-app sh -c 'ls -l /app/public/MP_verify_DALZUpUiOCb2WHb9.txt; wc -c /app/public/MP_verify_DALZUpUiOCb2WHb9.txt'
              curl -sS -m 5 -o /dev/null -w 'mp_local %{http_code}\n' http://127.0.0.1:3000/MP_verify_DALZUpUiOCb2WHb9.txt || true
              curl -sS -m 5 http://127.0.0.1:3000/MP_verify_DALZUpUiOCb2WHb9.txt || true
              echo
            else
              echo 'steam-app container missing'
            fi
            rm -f "$tmp"

            echo "=== docker ps after ==="
            docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
