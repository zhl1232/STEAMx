name: CI / PR Checks

on:
  workflow_call:
    inputs:
      profile:
        type: string
        default: full
      before:
        type: string
        default: ''
      verified-sha:
        type: string
        default: ''
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  # Only supersede runs for the same PR. Never cancel a release caller's CI.
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-lint:
    # Draft PRs create a skipped check but never allocate a runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54329
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      PLAYWRIGHT_USE_SYSTEM_CHROME: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Locate passed PR checks
        id: pr-ci
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_BEFORE: ${{ github.event.before }}
        run: node scripts/release-ci-reuse.mjs find --candidate "$RUNNER_TEMP/pr-ci-candidate.json"

      - name: Download tested source proof
        if: steps.pr-ci.outputs.run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.pr-ci.outputs.run-id }}
          name: ${{ steps.pr-ci.outputs.artifact-name }}
          path: ${{ runner.temp }}/pr-ci-source-proof

      - name: Verify reusable PR checks
        id: reuse
        if: steps.pr-ci.outputs.run-id != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_BEFORE: ${{ github.event.before }}
        run: node scripts/release-ci-reuse.mjs verify --candidate "$RUNNER_TEMP/pr-ci-candidate.json" --proof-dir "$RUNNER_TEMP/pr-ci-source-proof"

      - name: Classify CI scope
        if: steps.reuse.outputs.reuse != 'true'
        id: scope
        env:
          CI_PROFILE: ${{ inputs.profile }}
          CI_BEFORE: ${{ inputs.before }}
          CI_VERIFIED_SHA: ${{ inputs.verified-sha }}
        run: node scripts/ci-scope.mjs

      - name: Verify CI scope policy
        if: steps.reuse.outputs.reuse != 'true'
        run: node --test scripts/ci-scope.test.mjs scripts/ci-test-impact.test.mjs scripts/ci-test-plan.test.mjs scripts/ci-unit-tests.test.mjs scripts/ci-source-proof.test.mjs scripts/release-ci-reuse.test.mjs scripts/release-voice-scope.test.mjs scripts/check-building-voice-headers.test.mjs scripts/home-ui-scope.test.mjs scripts/ci-workflow-contract.test.mjs

      - name: Select affected specialty checks
        id: test-plan
        if: (steps.scope.outputs.mode == 'full' || steps.scope.outputs.mode == 'home-ui')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-test-plan.mjs

      - name: Setup pnpm
        if: (steps.scope.outputs.mode == 'full' || steps.scope.outputs.mode == 'home-ui')
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
          run_install: false

      - name: Setup Node.js
        if: (steps.scope.outputs.mode == 'full' || steps.scope.outputs.mode == 'home-ui')
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify repository cleanup safety
        if: (steps.scope.outputs.mode == 'full' || steps.scope.outputs.mode == 'home-ui')
        run: node --test scripts/repository-cleanup-phase2.test.mjs

      - name: Install dependencies
        if: (steps.scope.outputs.mode == 'full' || steps.scope.outputs.mode == 'home-ui')
        run: pnpm install --frozen-lockfile

      - name: Lint code base (oxlint)
        if: (steps.scope.outputs.mode == 'full' || steps.scope.outputs.mode == 'home-ui')
        run: pnpm run lint

      - name: TypeScript type check (tsgo)
        if: (steps.scope.outputs.mode == 'full' || steps.scope.outputs.mode == 'home-ui')
        run: pnpm run type-check

      - name: Run unit tests
        if: (steps.scope.outputs.mode == 'full' || steps.scope.outputs.mode == 'home-ui')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-unit-tests.mjs

      - name: Verify portable physics lab
        if: (steps.scope.outputs.mode == 'full' || steps.scope.outputs.mode == 'home-ui') && steps.test-plan.outputs.physics != 'false'
        run: pnpm run test:physics-lab

      - name: Verify deployment, migration, and SEO scripts
        if: (steps.scope.outputs.mode == 'full' || steps.scope.outputs.mode == 'home-ui')
        run: node --test deploy/registry-deploy.test.mjs scripts/db-push.test.mjs scripts/check-seo.test.mjs deploy/commerce-worker.test.mjs deploy/feishu-bridge.test.mjs scripts/upload-deploy-image-to-oss.test.mjs scripts/sign-deploy-image-url.test.mjs

      - name: Verify native store transactions
        if: (steps.scope.outputs.mode == 'full' || steps.scope.outputs.mode == 'home-ui') && steps.reuse.outputs.reuse != 'true' && steps.test-plan.outputs.store-db != 'false'
        run: node scripts/test-store-native.mjs

      - name: Start anonymous public content fixture
        if: (steps.scope.outputs.mode == 'full' || steps.scope.outputs.mode == 'home-ui') && github.event_name == 'pull_request'
        run: |
          node e2e/store-integration/data-server.mjs > "$RUNNER_TEMP/ci-public-content.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/ci-public-content.pid"
          if ! node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { setTimeout } from 'node:timers/promises';
          const pid = Number(readFileSync(`${process.env.RUNNER_TEMP}/ci-public-content.pid`, 'utf8').trim());
          let ready = false;
          for (let attempt = 0; attempt < 30; attempt++) {
            process.kill(pid, 0);
            try {
              const response = await fetch(`${process.env.NEXT_PUBLIC_SUPABASE_URL}/rest/v1/projects`, {
                signal: AbortSignal.timeout(1000),
              });
              const data = await response.json();
              ready = response.status === 200 && Array.isArray(data) && data.length === 0;
            } catch {}
            process.kill(pid, 0);
            if (ready) break;
            await setTimeout(200);
          }
          if (!ready) throw new Error('Anonymous public content fixture did not become ready');
          NODE
          then
            cat "$RUNNER_TEMP/ci-public-content.log"
            exit 1
          fi

      - name: Build app
        if: (steps.scope.outputs.mode == 'full' || steps.scope.outputs.mode == 'home-ui') && github.event_name == 'pull_request'
        run: pnpm run build

      - name: Verify production and development route boundaries
        if: (steps.scope.outputs.mode == 'full' || steps.scope.outputs.mode == 'home-ui') && github.event_name == 'pull_request'
        run: pnpm exec playwright test -c playwright.internal-routes.config.ts

      - name: Stop anonymous public content fixture
        if: always() && (steps.scope.outputs.mode == 'full' || steps.scope.outputs.mode == 'home-ui') && github.event_name == 'pull_request'
        run: |
          if [ -f "$RUNNER_TEMP/ci-public-content.pid" ]; then
            fixture_pid="$(cat "$RUNNER_TEMP/ci-public-content.pid")"
            if [[ "$fixture_pid" =~ ^[1-9][0-9]*$ ]]; then
              kill "$fixture_pid" 2>/dev/null || true
            fi
            rm -f "$RUNNER_TEMP/ci-public-content.pid"
          fi

      - name: Run smoke E2E
        if: (steps.scope.outputs.mode == 'full' || steps.scope.outputs.mode == 'home-ui')
        env:
          CI_PHYSICS_TESTS: ${{ steps.test-plan.outputs.physics }}
          CI_SMOKE_HOME: ${{ steps.test-plan.outputs.smoke-home }}
          CI_SMOKE_PLAYGROUND: ${{ steps.test-plan.outputs.smoke-playground }}
          CI_SMOKE_NATURE: ${{ steps.test-plan.outputs.smoke-nature }}
          CI_GUIDES_TESTS: ${{ steps.test-plan.outputs.guides }}
          CI_ASSET_TESTS: ${{ steps.test-plan.outputs.assets }}
        run: |
          specs=(e2e/smoke.spec.ts)
          if [ "$CI_GUIDES_TESTS" != 'false' ]; then
            specs+=(e2e/learning-guides.spec.ts)
          fi
          if [ "$CI_ASSET_TESTS" != 'false' ]; then
            specs+=(e2e/asset-cleanup.spec.ts e2e/repository-cleanup-phase2.spec.ts)
          fi
          if [ "$CI_PHYSICS_TESTS" != 'false' ]; then
            specs+=(e2e/physics-lab.spec.ts)
          fi
          excluded=()
          if [ "$CI_SMOKE_HOME" == 'false' ]; then excluded+=('@smoke-home'); fi
          if [ "$CI_SMOKE_PLAYGROUND" == 'false' ]; then excluded+=('@smoke-playground'); fi
          if [ "$CI_SMOKE_NATURE" == 'false' ]; then excluded+=('@smoke-nature'); fi
          filters=()
          if [ "${#excluded[@]}" -gt 0 ]; then
            pattern="$(IFS='|'; echo "${excluded[*]}")"
            filters+=(--grep-invert "$pattern")
          fi
          pnpm exec playwright test "${specs[@]}" --project=chromium "${filters[@]}"

      - name: Verify project video presentation pilot
        if: (steps.scope.outputs.mode == 'full' || steps.scope.outputs.mode == 'home-ui') && steps.test-plan.outputs.project-video != 'false'
        run: pnpm exec playwright test -c playwright.project-video-pilot.config.ts

      - name: Verify immersive building layout
        if: (steps.scope.outputs.mode == 'full' || steps.scope.outputs.mode == 'home-ui') && steps.test-plan.outputs.building != 'false'
        env:
          BUILDING_OUTLINE_EVIDENCE_DIR: ${{ runner.temp }}/building-immersive-evidence
        run: pnpm exec playwright test -c playwright.building-outline.config.ts immersive.spec.ts

      - name: Preserve immersive building evidence
        if: always() && (steps.scope.outputs.mode == 'full' || steps.scope.outputs.mode == 'home-ui') && steps.test-plan.outputs.building != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: immersive-building-evidence
          path: ${{ runner.temp }}/building-immersive-evidence
          retention-days: 7

      - name: Verify local Vosk engineering (silent input; acoustic benchmark is manual)
        if: (steps.scope.outputs.mode == 'full' || steps.scope.outputs.mode == 'home-ui') && steps.test-plan.outputs.voice != 'false'
        env:
          BUILDING_VOSK_EVIDENCE_DIR: ${{ runner.temp }}/building-vosk-evidence
        run: pnpm test:e2e:building-vosk:engineering

      - name: Preserve local voice acceptance evidence
        if: always() && (steps.scope.outputs.mode == 'full' || steps.scope.outputs.mode == 'home-ui') && steps.test-plan.outputs.voice != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: building-vosk-evidence
          path: ${{ runner.temp }}/building-vosk-evidence
          retention-days: 7

      # Only a successful completed PR job can publish proof for Release reuse.
      - name: Record tested PR source
        id: source-proof
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          CI_PROOF_PROFILE: ${{ steps.scope.outputs.mode }}
        run: node scripts/ci-source-proof.mjs record --output "$RUNNER_TEMP/ci-source-proof/source-proof.json" --profile "$CI_PROOF_PROFILE"

      - name: Preserve tested PR source
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.source-proof.outputs.artifact-name }}
          path: ${{ runner.temp }}/ci-source-proof/source-proof.json
          if-no-files-found: error
          overwrite: false
          compression-level: 0
          retention-days: 30
