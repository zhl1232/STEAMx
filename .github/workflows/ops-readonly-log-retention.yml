name: Ops Readonly Log Retention

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-readonly-log-retention
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Read-only prod nginx/docker/journald log retention probe
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          command_timeout: 5m
          script: |
            set -euo pipefail
            echo '' | base64 -d > /tmp/readonly_log_retention_probe.sh
            chmod +x /tmp/readonly_log_retention_probe.sh
            bash /tmp/readonly_log_retention_probe.sh
            rm -f /tmp/readonly_log_retention_probe.sh
