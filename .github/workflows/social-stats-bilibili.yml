name: Social Stats Bilibili

# Daily Bilibili public stats -> /var/lib/social-stats/bilibili-YYYY-MM-DD.json on ECS.
# 13:23 UTC = 21:23 CST (before the ECS 21:33 cron). No login cookie.
on:
  schedule:
    - cron: "23 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: social-stats-bilibili
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 20
    steps:
      - name: Fetch Bilibili stats
        run: |
          cat > bilibili_stats.py <<'PYEOF'
          #!/usr/bin/env python3
          # Bilibili public stats for UID 7891537. No login cookie. Anonymous buvid (spi) only as 412 fallback.
          import json, time, hashlib, urllib.request, urllib.parse, urllib.error, datetime, sys
          UID = "7891537"; TZ = datetime.timezone(datetime.timedelta(hours=8))
          H = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36", "Referer": "https://space.bilibili.com/%s" % UID, "Origin": "https://space.bilibili.com"}
          state = {"anon_buvid_used": False}
          def _get(url, params):
              if params: url += "?" + urllib.parse.urlencode(params)
              with urllib.request.urlopen(urllib.request.Request(url, headers=H), timeout=20) as r: return json.load(r)
          def get(url, params=None):
              try: d = _get(url, params)
              except urllib.error.HTTPError as e:
                  if e.code != 412 or state["anon_buvid_used"]: raise
                  d = None
              if d is None or (d.get("code") == -352 and not state["anon_buvid_used"]):
                  s = _get("https://api.bilibili.com/x/frontend/finger/spi", None)["data"]
                  H["Cookie"] = "buvid3=%s; buvid4=%s" % (s["b_3"], s["b_4"]); state["anon_buvid_used"] = True; time.sleep(2)
                  d = _get(url, params)
              return d
          MIX = [46,47,18,2,53,8,23,32,15,50,10,31,58,3,45,35,27,43,5,49,33,9,42,19,29,28,14,39,12,38,41,13,37,48,7,16,24,55,40,61,26,17,0,1,60,51,30,4,22,25,54,21,56,59,6,63,57,62,11,36,20,34,44,52]
          def wbi_key():
              d = get("https://api.bilibili.com/x/web-interface/nav")["data"]["wbi_img"]
              raw = d["img_url"].rsplit("/",1)[1].split(".")[0] + d["sub_url"].rsplit("/",1)[1].split(".")[0]
              return "".join(raw[i] for i in MIX)[:32]
          def sign(params, key):
              p = dict(params, wts=int(time.time())); p = {k: "".join(c for c in str(v) if c not in "!'()*") for k, v in sorted(p.items())}
              p["w_rid"] = hashlib.md5((urllib.parse.urlencode(p) + key).encode()).hexdigest(); return p
          now = datetime.datetime.now(TZ); res = {"collected_at": now.isoformat(), "date": now.date().isoformat(), "source": "github-actions", "uid": UID}
          try:
              st = get("https://api.bilibili.com/x/relation/stat", {"vmid": UID}); res["follower"] = st.get("data", {}).get("follower"); res["following"] = st.get("data", {}).get("following")
              time.sleep(2); key = wbi_key(); bvids, pn = [], 1
              while True:
                  time.sleep(3)
                  d = get("https://api.bilibili.com/x/space/wbi/arc/search", sign({"mid": UID, "ps": 30, "pn": pn, "order": "pubdate", "dm_img_list": "[]", "dm_img_str": "V2ViR0wgMS4wIChPcGVuR0wgRVMgMi4wIENocm9taXVtKQ", "dm_cover_img_str": "QU5HTEUgKEludGVsKQ"}, key))
                  if d.get("code") != 0:
                      res["wbi_list_error"] = "code=%s %s" % (d.get("code"), str(d.get("message"))[:60])
                      # fallback: public keyword-archive endpoint (no WBI)
                      bvids, p2 = [], 1
                      while True:
                          time.sleep(3)
                          r = get("https://api.bilibili.com/x/series/recArchivesByKeywords", {"mid": UID, "keywords": "", "ps": 50, "pn": p2})
                          if r.get("code") != 0: res["list_error"] = "fallback code=%s %s" % (r.get("code"), str(r.get("message"))[:60]); break
                          arc = r["data"].get("archives") or []; bvids += [a["bvid"] for a in arc]
                          res["list_source"] = "recArchivesByKeywords"
                          if not arc or len(bvids) >= (r["data"].get("page") or {}).get("total", 0) or p2 >= 20: break
                          p2 += 1
                      break
                  res["list_source"] = "wbi_arc_search"
                  vl = d["data"]["list"]["vlist"]; bvids += [v["bvid"] for v in vl]
                  if not vl or len(bvids) >= d["data"]["page"]["count"] or pn >= 20: break
                  pn += 1
              items = []
              for b in bvids:
                  time.sleep(2)
                  try:
                      v = get("https://api.bilibili.com/x/web-interface/view", {"bvid": b})["data"]; s = v["stat"]
                      items.append({"bvid": b, "title": v["title"], "pubdate": datetime.datetime.fromtimestamp(v["pubdate"], TZ).isoformat(), "view": s["view"], "like": s["like"], "reply": s["reply"], "favorite": s["favorite"], "share": s["share"], "coin": s["coin"], "danmaku": s["danmaku"]})
                  except Exception as e: items.append({"bvid": b, "error": str(e)[:80]})
              res["video_count"] = len(bvids); res["items"] = items
              res["totals"] = {k: sum(i.get(k, 0) for i in items) for k in ("view","like","reply","favorite","share")}
          except Exception as e: res["error"] = str(e)[:120]
          res["anon_buvid_used"] = state["anon_buvid_used"]
          json.dump(res, open("bilibili.json", "w"), ensure_ascii=False)
          top = sorted([i for i in res.get("items", []) if "view" in i], key=lambda i: -i["view"])[:5]
          print("SUMMARY follower=%s videos=%s anon_buvid=%s err=%s totals=%s" % (res.get("follower"), res.get("video_count"), res["anon_buvid_used"], res.get("error") or res.get("list_error"), res.get("totals")))
          for i in top: print("TOP %s view=%s like=%s %s" % (i["bvid"], i["view"], i["like"], i["title"][:30]))
          PYEOF
          python3 bilibili_stats.py
          echo "BILI_B64=$(gzip -c bilibili.json | base64 -w0)" >> "$GITHUB_ENV"
      - name: Deliver to server
        uses: appleboy/ssh-action@v1.2.0
        env:
          BILI_B64: ${{ env.BILI_B64 }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          command_timeout: 2m
          envs: BILI_B64
          script: |
            set -euo pipefail
            D=$(TZ=Asia/Shanghai date +%F); DIR=/var/lib/social-stats; T=$DIR/.bilibili-$D.json.tmp
            echo "$BILI_B64" | base64 -d | gunzip > "$T"
            python3 -c "import json,sys;json.load(open(sys.argv[1]))" "$T"
            chmod 640 "$T"; mv -f "$T" "$DIR/bilibili-$D.json"
            ls -la "$DIR/bilibili-$D.json"
